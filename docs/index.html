<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Mirror</title>

<style>
:root{
--bg:#0b0b0b;
--card:#141414;
--stroke:#2a2a2a;
--text:#eaeaea;
--muted:#a8a8a8;
}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* dynamic background */
#bg{
position:fixed;
inset:0;
z-index:-2;
background-size:cover;
background-position:center;
filter:blur(30px) brightness(.55);
opacity:0;
transition:opacity .5s ease;
transform:scale(1.1);
}
#bg.on{opacity:.45;}

#vignette{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(circle at center, transparent 20%, black 85%);
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
font-size:56px;
margin:10px 0 10px;
font-weight:900;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:18px;
}

.tab{
padding:10px 18px;
border-radius:999px;
border:1px solid var(--stroke);
background:#151515;
cursor:pointer;
font-weight:800;
}

.tab.active{
background:#232323;
border-color:#444;
}

.card{
background:rgba(20,20,20,.7);
border:1px solid var(--stroke);
border-radius:22px;
padding:20px;
margin-bottom:20px;
}

.list{
display:flex;
flex-direction:column;
gap:14px;
}

.item{
display:flex;
align-items:center;
gap:12px;
}

.rank{
width:38px;height:38px;
border-radius:12px;
border:1px solid #333;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
opacity:.7;
}

.cover{
width:50px;height:50px;
border-radius:12px;
object-fit:cover;
border:1px solid #333;
}

.meta{
flex:1;
}

.title{
font-weight:900;
font-size:18px;
}

.artist{
color:var(--muted);
font-weight:700;
}

.count{
font-weight:900;
opacity:.7;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="bg"></div>
<div id="vignette"></div>

<div class="container">
<h1>Listening Mirror</h1>

<div class="tabs">
<div class="tab active" data-tab="now">Now</div>
<div class="tab" data-tab="top">Top</div>
<div class="tab" data-tab="mirror">Mirror</div>
<div class="tab" data-tab="history">History</div>
</div>

<!-- NOW -->
<div id="now" class="panel">
<div class="card">
<h2>Now Playing</h2>
<div id="nowContent">Loading...</div>
</div>
</div>

<!-- TOP -->
<div id="top" class="panel hidden">
<div class="card">
<h2>Top Tracks</h2>
<div id="topTracks" class="list"></div>
</div>

<div class="card">
<h2>Top Artists</h2>
<div id="topArtists" class="list"></div>
</div>
</div>

<!-- MIRROR -->
<div id="mirror" class="panel hidden">
<div class="card">
<h2>Mirror</h2>
<div id="mirrorText">Opening mirror...</div>
</div>
</div>

<!-- HISTORY -->
<div id="history" class="panel hidden">
<div class="card">
<h2>History</h2>
<div id="historyList" class="list"></div>
</div>
</div>

</div>

<script>
const BASE="https://i.errtanq9.workers.dev";

/* tabs */
document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick=()=>{
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
tab.classList.add("active");

const target=tab.dataset.tab;
document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
document.getElementById(target).classList.remove("hidden");

if(target==="top") loadTop();
if(target==="history") loadHistory();
if(target==="mirror") loadMirror();
};
});

/* NOW */
async function loadNow(){
const r=await fetch(BASE+"/api/now");
const d=await r.json();

document.getElementById("nowContent").innerHTML=`
<div class="item">
<img class="cover" src="${d.image}">
<div class="meta">
<div class="title">${d.name}</div>
<div class="artist">${d.artist}</div>
</div>
</div>`;
}
loadNow();

/* TOP */
async function loadTop(){

/* tracks */
const t=await (await fetch(BASE+"/api/top?type=tracks&period=7day&limit=8")).json();
const trackBox=document.getElementById("topTracks");
trackBox.innerHTML="";

t.tracks.forEach((x,i)=>{
trackBox.innerHTML+=`
<div class="item">
<div class="rank">${i+1}</div>
<img class="cover" src="${x.image}">
<div class="meta">
<div class="title">${x.name}</div>
<div class="artist">${x.artist||""}</div>
</div>
<div class="count">${x.playcount}</div>
</div>`;
});

/* artists + BACKGROUND */
const a=await (await fetch(BASE+"/api/top?type=artists&period=7day&limit=8")).json();
const artistBox=document.getElementById("topArtists");
artistBox.innerHTML="";

a.artists.forEach((x,i)=>{
artistBox.innerHTML+=`
<div class="item">
<div class="rank">${i+1}</div>
<img class="cover" src="${x.image}">
<div class="meta">
<div class="title">${x.name}</div>
</div>
<div class="count">${x.playcount}</div>
</div>`;
});

/* BACKGROUND FIX */
if(a.artists[0] && a.artists[0].image){
const bg=document.getElementById("bg");
bg.style.backgroundImage=`url(${a.artists[0].image})`;
bg.classList.add("on");
}
}

/* HISTORY */
async function loadHistory(){
const r=await fetch(BASE+"/api/recent?limit=10");
const d=await r.json();

const box=document.getElementById("historyList");
box.innerHTML="";

d.tracks.forEach((x,i)=>{
box.innerHTML+=`
<div class="item">
<div class="rank">${i+1}</div>
<img class="cover" src="${x.image}">
<div class="meta">
<div class="title">${x.name}</div>
<div class="artist">${x.artist}</div>
</div>
</div>`;
});
}

/* MIRROR */
async function loadMirror(){
const r=await fetch(BASE+"/api/reflection",{method:"POST"});
const d=await r.json();
document.getElementById("mirrorText").textContent=d.text;
}
</script>

</body>
</html>
