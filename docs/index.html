<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0e" />
<title>Listening Mirror</title>

<style>

:root{
  --bg:#0b0c0e;
  --bg2:#090a0c;
  --card: rgba(255,255,255,.055);
  --card2: rgba(255,255,255,.035);
  --text:#ececee;
  --muted:#a7abb4;
  --muted2:#7d828d;
  --shadow: 0 18px 55px rgba(0,0,0,.55);
  --r: 22px;
  --live:#ff3b3b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

/* APP WRAP */
.app{
  padding:18px;
  max-width:900px;
  margin:auto;
}

/* HEADER */
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.title{
  font-weight:700;
  font-size:18px;
}

.sub{
  font-size:12px;
  color:var(--muted2);
  display:flex;
  gap:8px;
  align-items:center;
}

.dot{
  width:7px;
  height:7px;
  border-radius:99px;
  background:#444;
}

.dot.on{
  background:#31d07c;
  box-shadow:0 0 0 4px rgba(49,208,124,.12);
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  padding:8px;
  margin:16px 0;
  border-radius:999px;
  background:rgba(255,255,255,.05);
}

.tabBtn{
  border:0;
  background:transparent;
  color:#bbb;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
}

.tabBtn[aria-selected="true"]{
  background:rgba(255,255,255,.1);
  color:white;
}

/* PANELS */
.hidden{display:none}

/* CARD */
.card{
  border-radius:22px;
  background:linear-gradient(180deg,var(--card),var(--card2));
  padding:18px;
  position:relative;
  backdrop-filter:blur(8px);
}

/* LIVE BADGE */
.chip{
  position:absolute;
  top:14px;
  right:14px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,59,59,.12);
  color:white;
  font-size:12px;
  display:none;
}

.chip.live{
  display:block;
}

/* NOW SECTION */
.nowMain{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:14px;
  align-items:center;
}

.coverWrap{
  width:110px;
  height:110px;
  border-radius:20px;
  overflow:hidden;
  background:#111;
  position:relative;
}

.coverImg{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.coverFallback{
  display:grid;
  place-items:center;
  height:100%;
  color:#555;
  font-size:26px;
}

.line1{
  font-weight:700;
  font-size:15px;
}

.line2{
  font-size:13px;
  color:#ccc;
  margin-top:6px;
}

.line3{
  font-size:12px;
  color:#888;
  margin-top:6px;
}

/* LIST (Top + Recent) */
.row{
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:12px;
  padding:10px;
  border-radius:14px;
  align-items:center;
}

.thumb{
  width:44px;
  height:44px;
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.mid .title{
  font-size:13.5px;
}

.mid .sub{
  font-size:12px;
  color:#888;
}

.right{
  font-size:12px;
  color:#ffd666;
  font-weight:700;
}

</style>
</head>

<body>

<div class="app">

<header class="brand">
  <div>
    <div class="title">Listening Mirror</div>
    <div class="sub">
      <span id="statusDot" class="dot"></span>
      <span id="statusLine">Offline</span>
    </div>
  </div>
</header>

<!-- TABS -->
<div class="tabs">
  <button class="tabBtn" data-tab="now" aria-selected="true">Now</button>
  <button class="tabBtn" data-tab="top">Top</button>
  <button class="tabBtn" data-tab="recent">Recent</button>
</div>

<!-- NOW -->
<section class="panel" data-panel="now">
  <div class="card">

    <div id="nowBadge" class="chip">LIVE</div>

    <div class="nowMain">

      <div class="coverWrap">
        <img id="nowImg" class="coverImg" />
        <div id="nowFallback" class="coverFallback">♪</div>
      </div>

      <div>
        <div id="nowTrack" class="line1">—</div>
        <div id="nowArtist" class="line2">—</div>
        <div id="nowAlbum" class="line3">—</div>
      </div>

    </div>

  </div>
</section>

<!-- TOP -->
<section class="panel hidden" data-panel="top">
  <div class="card">
    <div id="topList"></div>
  </div>
</section>

<!-- RECENT -->
<section class="panel hidden" data-panel="recent">
  <div class="card">
    <div id="recentList"></div>
  </div>
</section>

</div>

<script src="./app.js"></script>

</body>
</html>
