<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --bg2:#090a0c;
      --card: rgba(255,255,255,.055);
      --card2: rgba(255,255,255,.035);
      --text:#ececee;
      --muted:#a7abb4;
      --muted2:#7d828d;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r: 22px;

      --live:#ff3b3b;
      --liveBg: rgba(255,59,59,.10);
      --liveBd: rgba(255,59,59,.30);

      --safeL: max(14px, env(safe-area-inset-left));
      --safeR: max(14px, env(safe-area-inset-right));
      --safeT: max(14px, env(safe-area-inset-top));
      --safeB: max(14px, env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    html{ overscroll-behavior-y:none; }
    body{
      margin:0;
      overflow-x:hidden;
      overscroll-behavior-y:none;
      background:
        radial-gradient(1200px 700px at 25% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(255,255,255,.04), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .app{
      min-height:100%;
      padding: calc(var(--safeT) + 14px) var(--safeR) calc(var(--safeB) + 18px) var(--safeL);
      max-width: 920px;
      margin: 0 auto;
    }

    header{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 2px;
    }

    .glyph{
      width: 16px;
      height: 16px;
      border-radius: 999px;
      position:relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,.05) 55%, rgba(255,255,255,.03) 70%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      flex: 0 0 auto;
    }
    .glyph:before{
      content:"";
      position:absolute;
      inset:3px;
      border-radius: 999px;
      outline: 1px solid rgba(255,255,255,.10);
      background: radial-gradient(circle at 65% 35%, rgba(255,255,255,.10), transparent 60%);
      opacity:.9;
    }

    .wordmark{
      display:flex;
      flex-direction:column;
      line-height: 1.15;
    }
    .wordmark .title{
      font-size: 18px;
      font-weight: 720;
      letter-spacing: .35px;
      margin:0;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.70));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .wordmark .sub{
      margin-top: 6px;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted2);
      font-size: 12px;
      letter-spacing: .2px;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.14);
      outline: 1px solid rgba(255,255,255,.10);
    }
    .dot.on{
      background: rgba(49,208,124,.75);
      outline-color: rgba(49,208,124,.35);
      box-shadow: 0 0 0 3px rgba(49,208,124,.10);
    }

    .tabs{
      display:flex;
      gap:10px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      width: fit-content;
      margin: 12px 0 16px 0;
    }
    .tabBtn{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.72);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .2px;
      cursor:pointer;
    }
    .tabBtn[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .panel{ display:block; }
    .hidden{ display:none; }

    .card{
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--card), var(--card2));
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
/* NOW ambient */
    .nowAmbient{
      position:absolute;
      inset:-1px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease;
    }
    .nowAmbient.on{ opacity: 1; }
    .nowAmbient:before{
      content:"";
      position:absolute;
      inset:-40px;
      background-image: var(--ambient-url, none);
      background-size: cover;
      background-position: center;
      filter: blur(28px) saturate(1.12);
      transform: scale(1.10);
      opacity:.42;
    }
    .nowAmbient:after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(255,255,255,.06), transparent 55%),
        linear-gradient(180deg, rgba(10,11,13,.55), rgba(10,11,13,.88));
    }

    .nowWrap{ position:relative; padding: 18px; min-height: 180px; }

    /* LIVE chip — top right */
    .chip{
      position:absolute;
      top: 14px;
      right: 14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      outline: 1px solid rgba(255,255,255,.085);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing:.25px;
      white-space:nowrap;
      z-index:3;
    }
    .chip .miniDot{ width:6px;height:6px;border-radius:999px; background: rgba(255,255,255,.18); }
    .chip.live{
      color: rgba(255,255,255,.95);
      outline-color: var(--liveBd);
      background: var(--liveBg);
    }
    .chip.live .miniDot{
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(255,59,59,.12);
    }

    .nowMain{
      display:grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      align-items:center;
      position:relative;
      z-index:2;
      padding-top: 10px;
    }

    .coverWrap{
      width: 120px;
      height: 120px;
      border-radius: 20px;
      position:relative;
      overflow:hidden;
      outline: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      box-shadow: 0 18px 55px rgba(0,0,0,.55);
    }
    /* artwork glow */
    .coverWrap:before{
      content:"";
      position:absolute;
      inset:-30px;
      background-image: var(--cover-url, none);
      background-size: cover;
      background-position:center;
      filter: blur(20px) saturate(1.15);
      opacity:.26;
      transform: scale(1.10);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 35%, rgba(0,0,0,0) 68%);
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 35%, rgba(0,0,0,0) 68%);
      pointer-events:none;
      transition: opacity .25s ease;
    }

    .coverImg{ width:100%; height:100%; object-fit:cover; display:none; position:relative; z-index:2; }
    .coverFallback{
      position:absolute; inset:0; display:grid; place-items:center;
      color: rgba(255,255,255,.35); font-size: 30px; z-index:3;
    }

    /* Premium IDLE state (Option B) */
    .idle .nowAmbient{ opacity: 0 !important; }
    .idle .coverImg{ display:none !important; }
    .idle .coverFallback{ display:none !important; }
    .idle .coverWrap{
      background:
        radial-gradient(120px 120px at 35% 30%, rgba(255,255,255,.08), transparent 55%),
        radial-gradient(160px 140px at 70% 70%, rgba(255,255,255,.05), transparent 60%),
        rgba(255,255,255,.02);
      outline-color: rgba(255,255,255,.09);
    }
    .idle .coverWrap:before{ opacity: 0 !important; }
    .idle .idleOrb{
      opacity: 1;
      transform: scale(1);
    }
    .idleOrb{
      position:absolute;
      inset: 0;
      display:grid;
      place-items:center;
      opacity: 0;
      transform: scale(.98);
      transition: opacity .25s ease, transform .25s ease;
      z-index:3;
      pointer-events:none;
    }
    .idleOrb:before{
      content:"";
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.11), rgba(255,255,255,.03) 58%, rgba(255,255,255,.02) 70%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.50);
    }
    .idleOrb:after{
      content:"";
      position:absolute;
      width: 76px;
      height: 76px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.07);
      opacity: .9;
      -webkit-mask-image: radial-gradient(circle, #000 55%, transparent 75%);
      mask-image: radial-gradient(circle, #000 55%, transparent 75%);
    }

    .nowText{ min-width:0; padding-left: 4px; }
    .line1{ font-size: 15px; font-weight: 680; letter-spacing: .15px; }
    .line2{ margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.72); }
    .line3{ margin-top: 6px; font-size: 12px; color: var(--muted2); }

    /* Marquee — RIGHT fade only (no first-letter cut) */
    .marq{ display:inline-block; white-space:nowrap; will-change:transform; }
    .marqWrap{
      position:relative;
      overflow:hidden;
      padding-left: 3px;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
    }
    .marqOn .marq{ animation: marqMove var(--marqDur, 10s) linear infinite; }
    @keyframes marqMove{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(calc(-1 * var(--marqShift, 60px))); }
    }

    .controls{
      padding: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .seg{
      display:flex;
      gap:8px;
      padding: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      width: fit-content;
    }
    .seg button{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.74);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor:pointer;
      letter-spacing:.2px;
    }
    .seg button[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .list{ padding: 10px; }

    .row{
      display:grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 16px;
      align-items:center;
      user-select:none;
    }
    .row:hover{ background: rgba(255,255,255,.035); }
    .row:active{ background: rgba(255,255,255,.045); }

    .thumb{
      width: 44px; height: 44px;
      border-radius: 14px;
      overflow:hidden;
      position:relative;
      outline: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.40);
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumbFallback{
      position:absolute; inset:0; display:grid; place-items:center;
      color: rgba(255,255,255,.35); font-size: 18px;
    }

    .mid{ min-width:0; padding-left: 3px; }
    .title{
      font-size: 13.5px;
      font-weight: 650;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right{
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(255,255,255,.80);
      padding-left: 8px;
      white-space:nowrap;
    }
    .right.count{
      color: rgba(255,214,102,.92);
    }

    @media (max-width: 520px){
      .nowMain{ grid-template-columns: 106px 1fr; }
      .coverWrap{ width:106px;height:106px;border-radius:18px; }
      .tabs{ width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="glyph" aria-hidden="true"></div>
        <div class="wordmark">
          <div class="title">Listening Mirror</div>
          <div class="sub">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusLine">Offline</span>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true" role="tab">Now</button>
      <button class="tabBtn" data-tab="top" aria-selected="false" role="tab">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false" role="tab">Recent</button>
    </div>

    <section class="panel" data-panel="now">
      <div class="card idle" id="nowCard">
        <div id="nowAmbient" class="nowAmbient"></div>

        <div class="nowWrap">
          <!-- LIVE top-right -->
          <div id="nowBadge" class="chip live" style="display:none;">
            <span class="miniDot" aria-hidden="true"></span>
            <span id="nowBadgeText">LIVE</span>
          </div>

          <div class="nowMain">
            <div class="coverWrap" id="nowCoverWrap">
              <img id="nowImg" class="coverImg" alt="" />
              <div class="idleOrb" aria-hidden="true"></div>
              <div id="nowFallback" class="coverFallback" style="display:none;">♪</div>
            </div>

            <div class="nowText" id="nowText">
              <div class="line1 marqWrap" id="nowTrackWrap">
                <span class="marq" id="nowTrack"></span>
              </div>
              <div class="line2 marqWrap" id="nowArtistWrap">
                <span class="marq" id="nowArtist"></span>
              </div>
              <div class="line3 marqWrap" id="nowAlbumWrap">
                <span class="marq" id="nowAlbum"></span>
              </div>
              <!-- no messages in premium UI -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="controls">
          <div class="seg" aria-label="Top type">
            <button data-top-type="tracks" aria-selected="true">Track</button>
            <button data-top-type="artists" aria-selected="false">Artist</button>
            <button data-top-type="albums" aria-selected="false">Album</button>
          </div>

          <div class="seg" aria-label="Top period">
            <button data-top-period="today" aria-selected="true">Today</button>
            <button data-top-period="week" aria-selected="false">Week</button>
            <button data-top-period="year" aria-selected="false">Year</button>
          </div>
        </div>

        <div class="list" id="topList" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="list" id="recentList" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
