<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#090a0d;
      --text:#e9e9ea;
      --muted:#a7abb4;
      --muted2:#7c818c;
      --line:rgba(255,255,255,.10);

      --glassFill: rgba(18, 20, 26, .55);
      --glassStroke: rgba(255,255,255,.12);

      --r:22px;
      --r2:26px;

      --shadow: 0 18px 55px rgba(0,0,0,.55);

      --red:#ff4d4d;
      --green:#2fd178;

      --safeL: max(16px, env(safe-area-inset-left));
      --safeR: max(16px, env(safe-area-inset-right));
      --safeT: max(14px, env(safe-area-inset-top));
      --safeB: max(18px, env(safe-area-inset-bottom));

      /* dynamic (set by JS for NOW glow only) */
      --nowArt: none;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background: radial-gradient(1200px 900px at 30% -10%, rgba(76, 102, 255, .18), transparent 65%),
                  radial-gradient(900px 650px at 90% 10%, rgba(255, 77, 77, .10), transparent 60%),
                  #05060a;
      overflow-x:hidden;
    }

    /* NOW-only artwork glow */
    body.now-mode::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image: var(--nowArt);
      background-size: cover;
      background-position: center;
      filter: blur(34px) saturate(1.05);
      opacity:.18;
      transform: scale(1.08);
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background: radial-gradient(900px 700px at 30% 0%, rgba(255,255,255,.08), transparent 60%),
                  radial-gradient(900px 700px at 85% 35%, rgba(255,255,255,.05), transparent 60%),
                  linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.72));
      z-index:-1;
    }

    .wrap{
      width: min(980px, 100%);
      margin: 0 auto;
      padding: calc(var(--safeT) + 14px) var(--safeR) var(--safeB) var(--safeL);
    }

    /* header */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .brand{
      display:flex;
      align-items:baseline;
      gap:10px;
      min-width: 0;
    }
    .brandTitle{
      font-size: 24px;
      font-weight: 750;
      letter-spacing: .2px;
      line-height: 1.05;
      margin:0;
      padding-left: 2px;
    }
    .brandSub{
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted2);
      font-size: 13px;
      margin-top: 4px;
      padding-left: 2px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(47,209,120,.14);
    }

    /* segmented tabs */
    .seg{
      position:relative;
      display:flex;
      padding:8px;
      border-radius: 999px;
      gap:8px;
      margin: 12px 0 18px;
    }
    .seg.glass::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:999px;
      background: rgba(12, 14, 18, .42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 14px 40px rgba(0,0,0,.40);
    }
    .seg > *{ position:relative; z-index:1; }

    .seg button{
      flex:1;
      border:0;
      background: transparent;
      color: rgba(233,233,234,.72);
      padding: 12px 10px;
      border-radius: 999px;
      font-weight: 650;
      letter-spacing:.2px;
      font-size: 14px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .seg button.active{
      color: var(--text);
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }

    /* glass card */
    .card{
      position:relative;
      border-radius: var(--r2);
      padding: 18px;
      margin: 14px 0;
    }
    .card.glass::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--r2);
      background: var(--glassFill);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glassStroke);
      box-shadow: var(--shadow);
    }
    .card > *{ position:relative; z-index:1; }

    .sectionTitle{
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing:.15px;
      padding-left: 2px;
    }
    .sectionMeta{
      color: var(--muted2);
      font-size: 13px;
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 2px;
    }

    /* Now hero layout */
    .nowRow{
      display:flex;
      gap:14px;
      align-items:center;
      min-width:0;
    }
    .art{
      width:76px;
      height:76px;
      border-radius: 18px;
      overflow:hidden;
      flex:0 0 auto;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
      background: rgba(255,255,255,.06);
      position:relative;
    }
    .art img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .artFallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(233,233,234,.38);
      font-weight: 850;
      letter-spacing:.06em;
      font-size: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 18px;
    }

    .nowText{
      min-width:0;
      flex: 1 1 auto;
      padding-left: 2px;
    }

    /* Live indicator */
    .liveLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .liveLeft{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .liveDot{
      width:8px;
      height:8px;
      border-radius:999px;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(255,77,77,.14);
    }
    .liveLabel{
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
    }
    .updated{
      font-size: 12px;
      color: var(--muted2);
      white-space: nowrap;
      padding-left: 2px;
    }

    .title{
      font-size: 22px;
      font-weight: 850;
      letter-spacing: .15px;
      margin: 0;
      line-height: 1.15;
    }
    .sub{
      margin: 6px 0 0;
      color: rgba(233,233,234,.75);
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }
    .sub2{
      margin: 6px 0 0;
      color: rgba(233,233,234,.55);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* list items */
    .list{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .item{
      position:relative;
      border-radius: var(--r);
      padding: 12px 14px;
    }
    .item.glass::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--r);
      background: rgba(15, 17, 22, .50);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 12px 34px rgba(0,0,0,.38);
    }
    .item > *{ position:relative; z-index:1; }

    .itemRow{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .thumb{
      width:54px;
      height:54px;
      border-radius: 16px;
      overflow:hidden;
      flex:0 0 auto;
      background: rgba(255,255,255,.06);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .thumb.placeholder{
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(233,233,234,.30);
      font-size: 18px;
      font-weight: 800;
      letter-spacing:.02em;
    }

    .itemText{
      min-width:0;
      flex: 1 1 auto;
      padding-left: 2px;
    }
    .itemTitle{
      margin:0;
      font-size: 16px;
      font-weight: 800;
      color: rgba(233,233,234,.92);
      line-height:1.15;
    }
    .itemMeta{
      margin: 6px 0 0;
      font-size: 13px;
      color: rgba(233,233,234,.56);
      font-weight: 650;
      line-height:1.15;
    }

    .count{
      flex:0 0 auto;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 850;
      letter-spacing:.2px;
      padding-left: 10px;
      color: rgba(255, 200, 120, .95);
      text-shadow: 0 10px 30px rgba(0,0,0,.45);
    }

    /* marquee */
    .mq{
      display:block;
      max-width:100%;
      overflow:hidden;
      white-space:nowrap;
      position:relative;
      padding-left: 2px;
    }
    .mq > span{ display:inline-block; transform: translateZ(0); }
    .mq.marquee > span{
      padding-right: 40px;
      animation: scrollText 9s linear infinite;
    }
    @keyframes scrollText{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-50%); }
    }

    /* top controls */
    .controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 12px;
    }
    .pills{
      position:relative;
      display:flex;
      gap:8px;
      padding:8px;
      border-radius: 999px;
    }
    .pills.glass::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: 999px;
      background: rgba(12, 14, 18, .35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.08);
    }
    .pills > *{ position:relative; z-index:1; }
    .pills button{
      flex:1;
      border:0;
      background: transparent;
      color: rgba(233,233,234,.66);
      padding: 10px 10px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 13px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pills button.active{
      color: var(--text);
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }

    .hint{
      color: rgba(233,233,234,.46);
      font-size: 12px;
      margin-top: 10px;
      padding-left: 2px;
    }
    .hidden{ display:none !important; }

    @media (max-width:420px){
      .wrap{ padding-left: max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right)); }
      .title{ font-size: 20px; }
      .brandTitle{ font-size: 22px; }
      .art{ width:72px; height:72px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div>
          <h1 class="brandTitle">Listening Mirror</h1>
          <div class="brandSub"><span class="dot" aria-hidden="true"></span><span id="statusText">Online</span></div>

    <nav class="seg glass" aria-label="Tabs">

    <!-- NOW -->
    <section id="viewNow">
      <div class="card glass" id="nowCard">

          <div class="liveLeft">

        <div class="nowRow">

    <!-- TOP -->
    <section id="viewTop" class="hidden">
      <div class="card glass">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px; min-width:0;">

            <div class="sectionMeta">
              <span id="topMeta">tracks • year</span>

          <div class="pills glass" aria-label="Top type">

          <div class="pills glass" aria-label="Top period">

            <h2 class="sectionTitle">Recent</h2>
            <div class="sectionMeta">last 10</div>
          </div>
          <div class="sectionMeta" style="opacity:.9; font-weight:800;">10</div>

        <div class="list" id="recentList"></div>

<!-- PART 2/4 — index.html (FULL REPLACE CONT.) -->
    <script>
      // ===== CONFIG =====
      const WORKER_BASE = "https://i.errtanq9.workers.dev"; // your Cloudflare Worker
      const LIMIT_TOP = 10;
      const LIMIT_RECENT = 10;

      const state = {
        tab: "now",
        topType: "tracks",
        topPeriod: "year",
        timers: { now: null }
      };

      const $ = (id) => document.getElementById(id);

      function safeText(v){
        if (v === null || v === undefined) return "";
        return String(v);
      }

      function ensureHttps(url){
        const u = safeText(url).trim();
        if(!u) return "";
        // Fix mixed content (GitHub Pages is https)
        if(u.startsWith("http://")) return "https://" + u.slice("http://".length);
        return u;
      }

      function fmtTime(ts){
        try{
          const d = ts ? new Date(ts) : new Date();
          return d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });
        }catch{
          return "—";
        }
      }

      async function fetchJson(url){
        const res = await fetch(url, { cache: "no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      }

      function setupMarquee(mqEl){
        if(!mqEl) return;
        const span = mqEl.querySelector("span");
        if(!span) return;

        mqEl.classList.remove("marquee");
        span.dataset.duped = "0";

        requestAnimationFrame(() => {
          const needs = span.scrollWidth > mqEl.clientWidth + 2;
          if(!needs) return;

          if(span.dataset.duped !== "1"){
            const txt = span.textContent;
            span.textContent = txt + "   •   " + txt;
            span.dataset.duped = "1";
          }
          mqEl.classList.add("marquee");
        });
      }

      function setupAllMarquees(){
        setupMarquee($("nowTitleMq"));
        setupMarquee($("nowArtistMq"));
        setupMarquee($("nowAlbumMq"));
      }

      function setTab(tab){
        state.tab = tab;

        $("tabNow").classList.toggle("active", tab === "now");
        $("tabTop").classList.toggle("active", tab === "top");
        $("tabRecent").classList.toggle("active", tab === "recent");

        $("viewNow").classList.toggle("hidden", tab !== "now");
        $("viewTop").classList.toggle("hidden", tab !== "top");
        $("viewRecent").classList.toggle("hidden", tab !== "recent");

        document.body.classList.toggle("now-mode", tab === "now");
      }

      function makeThumb(url, fallbackChar="♪"){
        const div = document.createElement("div");
        div.className = "thumb glass";
        const finalUrl = ensureHttps(url);

        if(finalUrl){
          div.className = "thumb";
          const img = document.createElement("img");
          img.loading = "lazy";
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.src = finalUrl;
          img.onerror = () => {
            // if still fails, just show placeholder
            div.innerHTML = "";
            div.className = "thumb placeholder";
            div.textContent = fallbackChar;
          };
          div.appendChild(img);
        }else{
          div.classList.add("placeholder");
          div.textContent = fallbackChar;
        }
        return div;
      }

      function makeListItem({ index, title, meta, image, countText, countColor }){
        const wrap = document.createElement("div");
        wrap.className = "item glass";

        const row = document.createElement("div");
        row.className = "itemRow";

        const thumb = makeThumb(image, "♪");

        const txt = document.createElement("div");
        txt.className = "itemText";

        const t = document.createElement("p");
        t.className = "itemTitle mq";
        const tSpan = document.createElement("span");
        tSpan.textContent = `${index}. ${title}`;
        t.appendChild(tSpan);

        const m = document.createElement("p");
        m.className = "itemMeta mq";
        const mSpan = document.createElement("span");
        mSpan.textContent = meta;
        m.appendChild(mSpan);

        txt.appendChild(t);
        txt.appendChild(m);

        row.appendChild(thumb);
        row.appendChild(txt);

        if(countText){
          const c = document.createElement("div");
          c.className = "count";
          c.textContent = countText;
          if(countColor) c.style.color = countColor;
          row.appendChild(c);
        }

        wrap.appendChild(row);

        // no click actions
        wrap.style.cursor = "default";
        wrap._mqEls = [t, m];

        return wrap;
      }

      function pickImage(obj){
        if(!obj) return "";
        if(typeof obj.image === "string") return obj.image;
        if(obj.image && typeof obj.image.url === "string") return obj.image.url;
        if(Array.isArray(obj.images) && obj.images.length){
          const best = obj.images[0]?.url || obj.images[0];
          if(typeof best === "string") return best;
        }
        if(Array.isArray(obj.image) && obj.image.length){
          const cand = obj.image[obj.image.length - 1];
          const t = cand && (cand["#text"] || cand.url);
          if(typeof t === "string" && t) return t;
        }
        return "";
      }

      function normalizeNow(data){
        const n = data?.now || data?.track || data?.item || data;
        const title = safeText(n?.name || n?.title || n?.track || n?.song || "—");
        const artist = safeText(n?.artist?.name || n?.artist || n?.creator || "—");
        const album = safeText(n?.album?.name || n?.album || n?.release || "");
        const image = pickImage(n) || pickImage(n?.album) || pickImage(n?.track);
        const ts = n?.ts || n?.timestamp || n?.playedAt || Date.now();
        return { title, artist, album, image, ts };
      }

      function normalizeTopList(data){
        const arr = data?.items || data?.top || data?.list || data || [];
        if(!Array.isArray(arr)) return [];
        return arr.map((it) => {
          const title = safeText(it?.name || it?.title || "—");
          const artist = safeText(it?.artist?.name || it?.artist || "");
          const album = safeText(it?.album?.name || it?.album || "");
          const image = pickImage(it) || pickImage(it?.album);
          const count = it?.plays || it?.playcount || it?.count || it?.listeners || it?.scrobbles;
          return { title, artist, album, image, count };
        });
      }

      function normalizeRecentList(data){
        const arr = data?.items || data?.recent || data?.list || data || [];
        if(!Array.isArray(arr)) return [];
        return arr.map((it) => {
          const title = safeText(it?.name || it?.title || "—");
          const artist = safeText(it?.artist?.name || it?.artist || "");
          const album = safeText(it?.album?.name || it?.album || "");
          const image = pickImage(it) || pickImage(it?.album);
          return { title, artist, album, image };
        });
      }
<!-- PART 3/4 — index.html (FULL REPLACE CONT.) -->
      async function loadNow(){
        try{
          const url = `${WORKER_BASE}/api/now`;
          const data = await fetchJson(url);
          const now = normalizeNow(data);

          $("nowTitle").textContent = now.title || "—";
          $("nowArtist").textContent = now.artist || "—";
          $("nowAlbum").textContent = now.album || "";

          $("nowUpdated").textContent = `Updated: ${fmtTime(Date.now())}`;

          const imgEl = $("nowArtImg");
          const fallback = $("nowArtFallback");
          const imgUrl = ensureHttps(now.image);

          // reset visual state
          fallback.style.display = "flex";
          imgEl.style.display = "none";
          imgEl.removeAttribute("src");
          document.documentElement.style.setProperty("--nowArt", "none");

          if(imgUrl){
            imgEl.referrerPolicy = "no-referrer";

            imgEl.onerror = () => {
              // 1) if it was http (shouldn’t now), try https once more just in case
              const cur = safeText(imgEl.src);
              if(cur.startsWith("http://")){
                imgEl.src = ensureHttps(cur);
                return;
              }
              // 2) give up -> keep fallback
              imgEl.style.display = "none";
              fallback.style.display = "flex";
              document.documentElement.style.setProperty("--nowArt", "none");
            };

            imgEl.onload = () => {
              fallback.style.display = "none";
              imgEl.style.display = "block";

              // set glow only when we have confirmed artwork loaded
              const encoded = imgUrl.replace(/"/g, "%22");
              document.documentElement.style.setProperty("--nowArt", `url("${encoded}")`);
              setupAllMarquees();
            };

            imgEl.src = imgUrl;
          } else {
            setupAllMarquees();
          }

          $("statusText").textContent = "Online";
          return true;
        }catch(err){
          $("statusText").textContent = "Offline";
          return false;
        }
      }

      async function loadTop(){
        const type = state.topType;
        const period = state.topPeriod;

        $("topMeta").textContent = `${type} • ${period}`;

        const hint = $("topHint");
        hint.textContent = "";

        const list = $("topList");
        list.innerHTML = "";

        try{
          const url = `${WORKER_BASE}/api/top?type=${encodeURIComponent(type)}&period=${encodeURIComponent(period)}&limit=${LIMIT_TOP}`;
          const data = await fetchJson(url);
          const items = normalizeTopList(data).slice(0, LIMIT_TOP);

          if(items.length === 0){
            hint.textContent = "No data.";
            return;
          }

          const nodes = [];
          items.forEach((it, idx) => {
            const meta =
              type === "albums" ? (it.artist ? it.artist : "—") :
              type === "artists" ? "" :
              (it.artist ? it.artist : "");

            const rowMeta = meta.trim() ? meta : " ";

            const countText = (it.count !== undefined && it.count !== null) ? String(it.count) : "";
            const node = makeListItem({
              index: idx + 1,
              title: it.title,
              meta: rowMeta,
              image: it.image,
              countText,
              countColor: "rgba(255,200,120,.95)"
            });

            nodes.push(node);
            list.appendChild(node);
          });

          requestAnimationFrame(() => {
            nodes.forEach(n => (n._mqEls || []).forEach(mqEl => setupMarquee(mqEl)));
          });

          $("statusText").textContent = "Online";
        }catch(err){
          $("statusText").textContent = "Offline";
          hint.textContent = "Couldn’t load Top.";
        }
      }

      async function loadRecent(){
        const hint = $("recentHint");
        hint.textContent = "";

        const list = $("recentList");
        list.innerHTML = "";

        try{
          const url = `${WORKER_BASE}/api/recent?limit=${LIMIT_RECENT}`;
          const data = await fetchJson(url);
          const items = normalizeRecentList(data).slice(0, LIMIT_RECENT);

          if(items.length === 0){
            hint.textContent = "No recent items.";
            return;
          }

          const nodes = [];
          items.forEach((it, idx) => {
            const node = makeListItem({
              index: idx + 1,
              title: it.title,
              meta: it.artist || "—",
              image: it.image,
              countText: ""
            });
            nodes.push(node);
            list.appendChild(node);
          });

          requestAnimationFrame(() => {
            nodes.forEach(n => (n._mqEls || []).forEach(mqEl => setupMarquee(mqEl)));
          });

          $("statusText").textContent = "Online";
        }catch(err){
          $("statusText").textContent = "Offline";
          hint.textContent = "Couldn’t load Recent.";
        }
      }

      function bindTabs(){
        document.querySelectorAll(".seg button").forEach(btn => {
          btn.addEventListener("click", () => {
            setTab(btn.dataset.tab);
            if(btn.dataset.tab === "top") loadTop();
            if(btn.dataset.tab === "recent") loadRecent();
          }, { passive:true });
        });
      }

      function bindTopControls(){
        document.querySelectorAll("[data-type]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.topType = btn.dataset.type;
            ["topTypeTracks","topTypeArtists","topTypeAlbums"].forEach(id => $(id).classList.remove("active"));
            btn.classList.add("active");
            loadTop();
          }, { passive:true });
        });

        document.querySelectorAll("[data-period]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.topPeriod = btn.dataset.period;
            ["topPeriodToday","topPeriodWeek","topPeriodYear"].forEach(id => $(id).classList.remove("active"));
            btn.classList.add("active");
            loadTop();
          }, { passive:true });
        });
      }

      function startNowPolling(){
        if(state.timers.now) clearInterval(state.timers.now);
        state.timers.now = setInterval(() => {
          loadNow();
        }, 12000);
      }

      (function init(){
        bindTabs();
        bindTopControls();

        setTab("now");
        loadNow();
        startNowPolling();
      })();
    </script>
  </div>
</body>
</html>
