<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Mirror</title>

<style>
:root{
--bg:#0b0b0c;
--card:#141416;
--soft:#1c1c1f;
--text:#e9e9ea;
--muted:#9c9ca1;
--accent:#4ade80;
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(circle at 50% -20%, #1b1b1e 0%, #0b0b0c 60%);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;
}

.wrap{
max-width:720px;
margin:auto;
padding:22px 14px 40px;
}

h1{
font-size:42px;
margin:10px 0 16px;
letter-spacing:-1px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:18px;
align-items:center;
}

.dot{
width:10px;
height:10px;
background:var(--accent);
border-radius:50%;
margin-right:6px;
box-shadow:0 0 12px var(--accent);
}

.tab{
padding:10px 16px;
border-radius:22px;
background:var(--soft);
color:var(--text);
font-weight:500;
opacity:.8;
}

.card{
background:linear-gradient(180deg,#19191c,#111113);
border-radius:22px;
padding:16px;
margin-bottom:16px;
box-shadow:0 6px 28px rgba(0,0,0,.45);
}

.row{
display:flex;
align-items:center;
gap:14px;
}

.art{
width:74px;
height:74px;
border-radius:14px;
background:#222;
flex-shrink:0;
object-fit:cover;
}

.title{
font-size:18px;
font-weight:600;
}

.album{
font-size:14px;
color:var(--muted);
margin-top:3px;
}

.time{
margin-left:auto;
color:var(--muted);
font-size:13px;
font-variant-numeric:tabular-nums;
}

.badge{
margin-top:8px;
display:inline-block;
padding:5px 10px;
border-radius:999px;
background:#1f1f23;
color:var(--muted);
font-size:12px;
}

.list{
display:flex;
flex-direction:column;
gap:12px;
margin-top:6px;
}

.item{
display:flex;
align-items:center;
gap:12px;
background:rgba(255,255,255,.02);
padding:10px;
border-radius:16px;
}

.smallart{
width:52px;
height:52px;
border-radius:12px;
object-fit:cover;
background:#222;
}

.meta{
display:flex;
flex-direction:column;
}

.artist{
font-size:15px;
font-weight:600;
}

.track{
font-size:13px;
color:var(--muted);
}

.eq{
width:18px;
height:14px;
display:inline-flex;
gap:2px;
align-items:flex-end;
margin-right:6px;
opacity:.9;
}

.eq i{
width:3px;
background:#eaeaea;
border-radius:2px;
animation:eq 900ms ease-in-out infinite;
}

.eq i:nth-child(2){animation-delay:120ms}
.eq i:nth-child(3){animation-delay:240ms}
.eq i:nth-child(4){animation-delay:360ms}

@keyframes eq{
0%,100%{transform:scaleY(.5);opacity:.7}
50%{transform:scaleY(1.2);opacity:1}
}
</style>
</head>

<body>
<div class="wrap">

<h1>Listening Mirror</h1>

<div class="tabs">
<div class="dot"></div>
<div class="tab">Now</div>
<div class="tab">Today</div>
<div class="tab">Week</div>
</div>

<div id="now"></div>
<div id="today"></div>
<div id="week"></div>

</div>

<script>
const API="https://i.errtanq9.workers.dev/";

async function load(){

const data=await fetch(API).then(r=>r.json());

const now=data.now;
const today=data.today.slice(0,10);
const week=data.toptracks.slice(0,10);

document.getElementById("now").innerHTML=`
<div class="card">
<div class="row">
<img class="art" src="${now.art}">
<div>
<div class="title">${now.artist} — ${now.track}</div>
<div class="album">${now.album||""}</div>
<div class="badge">${now.playing?"live now playing":"last played"}</div>
</div>
</div>
</div>`;

document.getElementById("today").innerHTML=
`<div class="card"><h2>Today</h2><div class="list">`+
today.map(t=>`
<div class="item">
<div class="eq"><i></i><i></i><i></i><i></i></div>
<img class="smallart" src="${t.art}">
<div class="meta">
<div class="artist">${t.artist}</div>
<div class="track">${t.track}</div>
</div>
<div class="time">${t.time}</div>
</div>`).join("")+
`</div></div>`;

document.getElementById("week").innerHTML=
`<div class="card"><h2>Top Tracks (7 days)</h2><div class="list">`+
week.map(t=>`
<div class="item">
<img class="smallart" src="${t.art}">
<div class="meta">
<div class="artist">${t.artist}</div>
<div class="track">${t.track}</div>
</div>
<div class="time">${t.plays} plays</div>
</div>`).join("")+
`</div></div>`;
}

load();
setInterval(load,20000);
</script>

</body>
</html>
