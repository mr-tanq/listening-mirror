<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Listening Mirror</title>
  <style>
    :root{
      --bg:#0b0c0e;
      --card:#14161a;
      --card2:#101215;
      --text:#e9e9ea;
      --muted:#a8abb2;
      --muted2:#7f838c;
      --line:#242830;
      --pill:#1a1d22;
      --pill2:#101216;
      --ok:#31d07c;
      --live:#ff5a5a;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: radial-gradient(900px 500px at 20% -10%, rgba(255,255,255,.06), transparent 70%),
                  radial-gradient(900px 500px at 90% 0%, rgba(255,255,255,.04), transparent 70%),
                  var(--bg);
      color:var(--text);
    }
    .wrap{max-width:960px;margin:0 auto;padding:18px 14px 40px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 14px;border:1px solid var(--line);border-radius:24px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      font-weight:700;letter-spacing:.2px;
      flex:0 0 auto;
    }
    .btxt{min-width:0}
    .btitle{font-size:18px;font-weight:700;line-height:1.1}
    .bsub{font-size:13px;color:var(--muted);margin-top:2px}
    .btn{
      appearance:none;border:1px solid var(--line);border-radius:16px;
      padding:10px 14px;background:rgba(255,255,255,.04);color:var(--text);
      cursor:pointer;font-weight:600;
    }
    .btn:active{transform:translateY(1px)}

    .tabs{
      margin-top:14px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:24px;
      background: rgba(255,255,255,.03);
    }
    .tabRow{
      display:flex;gap:10px;
    }
    .tabBtn{
      flex:1;
      appearance:none;border:1px solid var(--line);
      border-radius:18px;
      padding:12px 10px;
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-weight:700;
      cursor:pointer;
    }
    .tabBtn[aria-selected="true"]{
      color:var(--text);
      background: rgba(255,255,255,.06);
    }

    .panel{margin-top:14px}
    .hidden{display:none!important}

    .card{
      border:1px solid var(--line);
      border-radius:26px;
      background: rgba(255,255,255,.03);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cardHead{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding:16px 16px 10px;
    }
    .cardTitle{font-weight:800;font-size:22px;line-height:1.1}
    .cardSub{color:var(--muted);margin-top:4px}
    .badge{
      min-width:52px;height:40px;border-radius:18px;
      border:1px solid var(--line);
      display:grid;place-items:center;
      color:var(--muted);
      background: rgba(255,255,255,.03);
      font-weight:800;
      flex:0 0 auto;
    }
    .badge.live{
      color:white;
      background: rgba(255,90,90,.18);
      border-color: rgba(255,90,90,.35);
    }

    .nowBody{padding:12px 16px 16px}
    .nowGrid{
      display:grid;
      grid-template-columns:84px 1fr;
      gap:14px;
      align-items:center;
    }
    .coverBig{
      width:84px;height:84px;border-radius:20px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      position:relative;
    }
    .coverBig img{
      width:100%;height:100%;object-fit:cover;display:block;
    }
    .coverFallback{
      position:absolute;inset:0;
      display:grid;place-items:center;
      font-size:26px;color:var(--muted2);
      background: rgba(255,255,255,.02);
    }

    .nowLines{min-width:0}
    .labelSmall{font-size:12px;color:var(--muted);margin-bottom:8px}
    .line1{font-size:22px;font-weight:900;letter-spacing:.1px;line-height:1.15}
    .line2{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.25}
    .line3{font-size:13px;color:var(--muted2);margin-top:4px;line-height:1.25}

    .workerHint{
      margin-top:12px;
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size:12px;color:var(--muted2);
      padding:12px 16px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.18);
      word-break:break-all;
    }

    .pillRow{
      display:flex;gap:10px;flex-wrap:wrap;
      padding:10px 16px 12px;
    }
    .pillBtn{
      appearance:none;border:1px solid var(--line);
      border-radius:16px;padding:10px 12px;
      background: rgba(255,255,255,.02);
      color: var(--muted);
      font-weight:800;cursor:pointer;
    }
    .pillBtn[aria-selected="true"]{
      color:var(--text);
      background: rgba(255,255,255,.06);
    }

    .list{padding:2px 10px 12px}
    .row{
      display:grid;
      grid-template-columns:64px 1fr auto;
      gap:12px;
      align-items:center;
      padding:10px;
      border-radius:18px;
    }
    .row + .row{border-top:1px solid rgba(255,255,255,.04)}
    .cover{
      width:56px;height:56px;border-radius:18px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      position:relative;
      flex:0 0 auto;
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .mid{min-width:0}
    .title{font-weight:900;font-size:16px;line-height:1.2;min-width:0}
    .sub{font-size:13px;color:var(--muted);margin-top:3px;min-width:0}
    .right{
      color:var(--muted);
      font-weight:900;
      padding-left:10px;
      min-width:34px;
      text-align:right;
    }
/* ---------------------------
       MARQUEE (auto-scroll on overflow)
       --------------------------- */
    .marquee{
      overflow:hidden;
      white-space:nowrap;
      position:relative;
    }
    .marqueeTrack{
      display:inline-flex;
      gap:42px;
      will-change:transform;
      animation: marquee 10s linear infinite;
      padding-right:42px;
    }
    /* πιο γρήγορο για μεγάλα titles */
    .marquee.fast .marqueeTrack{ animation-duration: 8s; }
    .marquee.slow .marqueeTrack{ animation-duration: 12s; }

    @keyframes marquee{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(-50%); }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .marqueeTrack{animation:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">LM</div>
        <div class="btxt">
          <div class="btitle">Listening Mirror</div>
          <div class="bsub" id="statusLine">Loading…</div>
        </div>
      </div>
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>

    <div class="tabs">
      <div class="tabRow">
        <button class="tabBtn" data-tab="now" aria-selected="true">Now Playing</button>
        <button class="tabBtn" data-tab="top" aria-selected="false">Top</button>
        <button class="tabBtn" data-tab="recent" aria-selected="false">Recent</button>
      </div>
    </div>

    <!-- NOW -->
    <section class="panel" data-panel="now">
      <div class="card">
        <div class="cardHead">
          <div>
            <div class="cardTitle">Now Playing</div>
            <div class="cardSub">Updated: <span id="nowUpdated">—</span></div>
          </div>
          <div class="badge" id="nowBadge">OFF</div>
        </div>

        <div class="nowBody">
          <div class="nowGrid">
            <div class="coverBig">
              <img id="nowImg" alt="" style="display:none" />
              <div class="coverFallback" id="nowFallback">♪</div>
            </div>

            <div class="nowLines">
              <div class="labelSmall" id="nowMsg">—</div>
              <div class="line1" id="nowTrack">—</div>
              <div class="line2" id="nowArtist">—</div>
              <div class="line3" id="nowAlbum">—</div>
            </div>
          </div>
        </div>

        <div class="workerHint" id="workerHint">Worker: —</div>
      </div>
    </section>

    <!-- TOP -->
    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="cardHead">
          <div>
            <div class="cardTitle">Top</div>
            <div class="cardSub" id="topMeta">—</div>
          </div>
          <div class="badge" id="topBadge">20</div>
        </div>

        <div class="pillRow">
          <button class="pillBtn" data-top-type="tracks" aria-selected="true">Tracks</button>
          <button class="pillBtn" data-top-type="artists" aria-selected="false">Artists</button>
          <button class="pillBtn" data-top-type="albums" aria-selected="false">Albums</button>
        </div>

        <div class="pillRow">
          <button class="pillBtn" data-top-period="today" aria-selected="true">Today</button>
          <button class="pillBtn" data-top-period="week" aria-selected="false">Week</button>
          <button class="pillBtn" data-top-period="year" aria-selected="false">Year</button>
        </div>

        <div class="list" id="topList"></div>
      </div>
    </section>
<!-- RECENT -->
    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="cardHead">
          <div>
            <div class="cardTitle">Recent</div>
            <div class="cardSub" id="recentMeta">—</div>
          </div>
          <div class="badge">last 10</div>
        </div>

        <div class="list" id="recentList"></div>
      </div>
    </section>

  </div>

  <script src="./app.js"></script>
</body>
</html>
