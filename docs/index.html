<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --card:#14161a;
      --card2:#101215;
      --text:#e9e9ea;
      --muted:#a8abb2;
      --muted2:#7f838c;
      --line:#242830;

      --glass: rgba(20,22,26,.64);
      --glass2: rgba(16,18,21,.52);

      --ok:#31d07c;
      --bad:#ff5a5a;
      --accent:#79a7ff;

      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --shadow2: 0 10px 28px rgba(0,0,0,.44);
      --r:22px;

      --blur: 14px; /* crisp */
      --stroke: rgba(255,255,255,.08);
      --stroke2: rgba(255,255,255,.06);

      /* dynamic tint (default = subtle blue) */
      --tint-r: 95;
      --tint-g: 124;
      --tint-b: 255;
      --tint-a: .18;
      --tint-a2: .10;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 20% -10%, rgba(95,124,255,.20), transparent 55%),
        radial-gradient(900px 520px at 80% 0%, rgba(255,90,90,.12), transparent 55%),
        radial-gradient(800px 600px at 50% 120%, rgba(49,208,124,.10), transparent 60%),
        linear-gradient(#08090b, #090a0c 40%, #060708);
      overflow-x:hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Dynamic tint layer (high-end) */
    .bgTint{
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transform: translateZ(0);
      background:
        radial-gradient(860px 520px at 18% -8%,
          rgba(var(--tint-r), var(--tint-g), var(--tint-b), var(--tint-a)),
          transparent 58%
        ),
        radial-gradient(900px 580px at 82% 0%,
          rgba(var(--tint-r), var(--tint-g), var(--tint-b), var(--tint-a2)),
          transparent 62%
        ),
        radial-gradient(860px 620px at 50% 118%,
          rgba(var(--tint-r), var(--tint-g), var(--tint-b), .08),
          transparent 66%
        );
      filter: saturate(1.15) contrast(1.03);
      opacity: 1;
      transition: background 520ms ease, filter 520ms ease;
    }

    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 14px 28px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 8px 6px 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .logo{
      width:46px; height:46px;
      border-radius:16px;
      display:grid; place-items:center;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
      border:1px solid var(--stroke);
      box-shadow: var(--shadow2);
      flex:0 0 auto;
    }
    .logo span{
      font-weight:800;
      letter-spacing:.5px;
      opacity:.92;
    }

    .brandText{min-width:0}
    .appTitle{
      font-size: 20px;
      font-weight: 820;
      letter-spacing:.2px;
      line-height:1.1;
      margin:0;
      white-space:nowrap;
    }
.statusRow{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:4px;
      color: var(--muted);
      font-size: 13px;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background: rgba(255,255,255,.25);
      box-shadow: 0 0 0 4px rgba(255,255,255,.05);
    }
    .dot.ok{ background: var(--ok); box-shadow: 0 0 0 4px rgba(49,208,124,.14); }
    .dot.bad{ background: var(--bad); box-shadow: 0 0 0 4px rgba(255,90,90,.14); }

    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 50;
      background: rgba(16,18,21,.82);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--stroke2);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow2);
      color: var(--text);
      font-size: 13px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .22s ease, transform .22s ease;
      transform-origin: center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .tabs{
      margin: 6px 0 14px;
      background: rgba(16,18,21,.58);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border:1px solid var(--stroke);
      border-radius: 24px;
      padding: 8px;
      display:flex;
      gap:8px;
      box-shadow: var(--shadow2);
    }
    .tabBtn{
      appearance:none;
      border:0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      padding: 12px 12px;
      border-radius: 18px;
      flex:1;
      cursor:pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .tabBtn[aria-selected="true"]{
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      transform: translateY(-1px);
    }

    .panel.hidden{display:none}
    .card{
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border:1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
    }
    .cardTitle{
      margin:0;
      font-size: 26px;
      letter-spacing:.2px;
      line-height:1.1;
    }
    .cardSub{
      margin-top:6px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing:.2px;
    }
    .badgePill{
      flex:0 0 auto;
      border-radius: 999px;
      padding: 10px 12px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      min-width: 44px;
      text-align:center;
    }
    .badgeLive{
      background: rgba(49,208,124,.18);
      border:1px solid rgba(49,208,124,.30);
      color: #d9ffe9;
      font-weight: 900;
      letter-spacing:.3px;
    }

    .gridNow{
      display:grid;
      grid-template-columns: 110px 1fr;
      gap: 16px;
      align-items:center;
      margin-top: 8px;
    }
.coverBig{
      width: 110px;
      height: 110px;
      border-radius: 22px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08);
      box-shadow: 0 10px 28px rgba(0,0,0,.45);
      overflow:hidden;
      position:relative;
    }
    .coverBig img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
    }
    .coverFallback{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color: rgba(255,255,255,.45);
      font-size: 22px;
      letter-spacing:.5px;
    }

    .nowMeta{ min-width:0; }
    .line{
      color: var(--muted2);
      font-size: 13px;
      margin-top: 10px;
      letter-spacing:.2px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-top: 10px;
    }
    .row{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.06);
      box-shadow: 0 10px 24px rgba(0,0,0,.38);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }
    .row:active{ transform: translateY(1px) scale(.995); }
    .row:hover{ border-color: rgba(255,255,255,.10); }

    .cover{
      width: 58px; height: 58px;
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.22);
      position:relative;
      flex: 0 0 auto;
    }
    .cover img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
    }
    .cover .coverFallback{ font-size: 16px; }

    .mid{ min-width:0; flex: 1 1 auto; }
    .right{
      flex: 0 0 auto;
      font-weight: 900;
      letter-spacing:.3px;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      color: var(--ok);
      opacity:.95;
    }

    .titleMarquee,
    .subMarquee{
      position: relative;
      overflow: hidden;
      min-width: 0;
      padding-left: 10px; /* safe zone */
    }

    .marqueeOn.titleMarquee,
    .marqueeOn.subMarquee{
      -webkit-mask-image: linear-gradient(to right,
        rgba(0,0,0,1) 0px,
        rgba(0,0,0,1) calc(100% - 22px),
        rgba(0,0,0,0) 100%
      );
      mask-image: linear-gradient(to right,
        rgba(0,0,0,1) 0px,
        rgba(0,0,0,1) calc(100% - 22px),
        rgba(0,0,0,0) 100%
      );
    }

    .marqueeInner{
      display:inline-block;
      padding-right: 26px;
      white-space: nowrap;
      will-change: transform;
    }
    .marqueeOn .marqueeInner{ animation: marquee 10s linear infinite; }

    @keyframes marquee{
      0%   { transform: translateX(0); }
      10%  { transform: translateX(0); }
      100% { transform: translateX(calc(-1 * var(--marquee-shift, 0px))); }
    }

    .title{
      font-size: 18px;
      font-weight: 860;
      letter-spacing:.2px;
      line-height:1.15;
      color: var(--text);
    }
    .sub{
      margin-top: 6px;
      color: rgba(255,255,255,.58);
      font-weight: 700;
      letter-spacing:.2px;
      line-height:1.1;
    }
.ctrls{
      margin-top: 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .seg{
      display:flex;
      gap:8px;
      padding: 8px;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.16);
    }
    .seg button{
      flex:1;
      border:0;
      border-radius: 18px;
      padding: 12px 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      cursor:pointer;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .seg button[aria-selected="true"]{
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.10);
      color: var(--text);
      transform: translateY(-1px);
    }

    .skeleton{
      position: relative;
      overflow:hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.06);
    }
    .skeleton::after{
      content:"";
      position:absolute;
      inset:-40% -60%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,.10) 35%,
        rgba(255,255,255,.18) 50%,
        rgba(255,255,255,.10) 65%,
        transparent 100%
      );
      transform: translateX(-30%);
      animation: shimmer 1.1s ease-in-out infinite;
    }
    @keyframes shimmer{
      0%{ transform: translateX(-40%); }
      100%{ transform: translateX(40%); }
    }

    .row:focus-visible,
    button:focus-visible{
      outline: 2px solid rgba(121,167,255,.70);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="bgTint" id="bgTint" aria-hidden="true"></div>
  <div class="toast" id="toast">Offline. Retrying…</div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>LM</span></div>
        <div class="brandText">
          <h1 class="appTitle">Listening Mirror</h1>
          <div class="statusRow">
            <span class="dot" id="statusDot"></span>
            <span id="statusLine">Connecting…</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true">Now Playing</button>
      <button class="tabBtn" data-tab="top" aria-selected="false">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false">Recent</button>
    </div>

    <!-- NOW -->
    <section class="panel" data-panel="now">
      <div class="card">
        <div class="cardHeader">
          <div>
            <h2 class="cardTitle">Now Playing</h2>
            <div class="cardSub">Updated: <span id="nowUpdated">--</span></div>
          </div>
          <div class="badgePill badgeLive" id="nowBadge">OFF</div>
        </div>

        <div class="gridNow">
          <div class="coverBig">
            <img id="nowImg" alt="" style="display:none" />
            <div class="coverFallback" id="nowFallback">♪</div>
          </div>

          <div class="nowMeta">
            <div class="titleMarquee" id="nowTrackWrap">
              <div class="title marqueeInner" id="nowTrack">—</div>
            </div>

            <div class="subMarquee" id="nowArtistWrap">
              <div class="sub marqueeInner" id="nowArtist">—</div>
            </div>

            <div class="subMarquee" id="nowAlbumWrap">
              <div class="sub marqueeInner" id="nowAlbum">—</div>
            </div>

            <div class="line" id="nowMsg"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- TOP -->
    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="cardHeader">
          <div>
            <h2 class="cardTitle">Top</h2>
            <div class="cardSub" id="topMeta">—</div>
          </div>
          <div class="badgePill" id="topBadge">10</div>
        </div>

        <div class="ctrls">
          <div class="seg" role="group" aria-label="Top type">
            <button data-top-type="tracks" aria-selected="true">Tracks</button>
            <button data-top-type="artists" aria-selected="false">Artists</button>
            <button data-top-type="albums" aria-selected="false">Albums</button>
          </div>

          <div class="seg" role="group" aria-label="Top period">
            <button data-top-period="today" aria-selected="true">Today</button>
            <button data-top-period="week" aria-selected="false">Week</button>
            <button data-top-period="year" aria-selected="false">Year</button>
          </div>
        </div>

        <div class="list" id="topList" aria-live="polite"></div>
      </div>
    </section>

    <!-- RECENT -->
    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="cardHeader">
          <div>
            <h2 class="cardTitle">Recent</h2>
            <div class="cardSub" id="recentMeta"></div>
          </div>
          <div class="badgePill">10</div>
        </div>

        <div class="list" id="recentList" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
