<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Listening Mirror</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">LM</div>
      <div>
        <div class="brandTitle">Listening Mirror</div>
        <div id="statusLine" class="brandSub">Loading…</div>
      </div>
    </div>

    <div class="actions">
      <button id="btnRefresh" class="btn">Refresh</button>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" role="tab" aria-selected="true" data-tab="now">Now Playing</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="top">Top</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="recent">Recent</button>
    </nav>

    <section class="panels">
      <!-- NOW -->
      <section class="panel" data-panel="now">
        <div class="card nowPlaying">
          <div class="cardHeader">
            <div>
              <div class="hTitle">Now Playing</div>
              <div id="nowUpdated" class="hSub">Updated: —</div>
            </div>
            <div id="nowBadge" class="pill">OFF</div>
          </div>

          <div class="npBody">
            <div class="cover">
              <img id="nowImg" alt="" style="display:none" />
              <div id="nowFallback" class="coverFallback">♪</div>
            </div>

            <div class="npText">
              <div id="nowTrack" class="npTrack">—</div>
              <div id="nowArtist" class="npArtist">—</div>
              <div id="nowAlbum" class="npAlbum">—</div>
              <div id="nowMsg" class="npTime">—</div>
            </div>
          </div>

          <div class="note">
            Worker: <code id="workerHint"></code>
          </div>
        </div>
      </section>

      <!-- TOP -->
      <section class="panel hidden" data-panel="top">
        <div class="card">
          <div class="cardHeader">
            <div>
              <div class="hTitle">Top</div>
              <div id="topMeta" class="hSub">—</div>
            </div>
            <div id="topBadge" class="pill">—</div>
          </div>

          <div class="subtabsRow">
            <div class="subtabs" role="tablist" aria-label="Top type">
              <button class="subtabBtn" role="tab" aria-selected="true" data-top-type="tracks">Tracks</button>
              <button class="subtabBtn" role="tab" aria-selected="false" data-top-type="artists">Artists</button>
              <button class="subtabBtn" role="tab" aria-selected="false" data-top-type="albums">Albums</button>
            </div>

            <div class="subtabs" role="tablist" aria-label="Top period">
              <button class="subtabBtn" role="tab" aria-selected="true" data-top-period="today">Today</button>
              <button class="subtabBtn" role="tab" aria-selected="false" data-top-period="week">Week</button>
              <button class="subtabBtn" role="tab" aria-selected="false" data-top-period="year">Year</button>
            </div>
          </div>

          <div id="topList" class="list"></div>

          <div class="note">
            Endpoint: <code>/api/top?type=tracks|artists|albums&amp;period=today|week|year&amp;limit=20</code>
          </div>
        </div>
      </section>

      <!-- RECENT -->
      <section class="panel hidden" data-panel="recent">
        <div class="card">
          <div class="cardHeader">
            <div>
              <div class="hTitle">Recent</div>
              <div id="recentMeta" class="hSub">—</div>
            </div>
            <div class="pill">last 10</div>
          </div>

          <div id="recentList" class="list"></div>

          <div class="note">
            Endpoint: <code>/api/history?limit=10</code>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="./apps.js" defer></script>
</body>
</html>
