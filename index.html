<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Listening Mirror</title>
  <style>
    :root { --bg1:#111; --bg2:#1a1a1a; --card:#2a2a2a; --text:#eee; --muted:#bdbdbd; --pill:#3a3a3a; }
    *{box-sizing:border-box} body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 30% 20%, #2b2b2b 0%, #141414 45%, #0d0d0d 100%);
      min-height:100vh;
      display:flex; justify-content:center;
    }
    .wrap{width:min(920px, 92vw); padding:28px 0 60px}
    h1{margin:10px 0 18px; font-size: clamp(44px, 7vw, 84px); letter-spacing:-0.02em; line-height:0.95}
    .row{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
    .dot{width:22px;height:22px;border-radius:50%; background:#26d07c; box-shadow:0 0 0 6px rgba(38,208,124,0.15)}
    .pill{
      border:0; color:var(--text);
      background: linear-gradient(#3a3a3a, #2d2d2d);
      padding:14px 24px; border-radius:999px;
      font-weight:700; font-size:20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 10px 30px rgba(0,0,0,0.35);
    }
    .pill:active{transform:translateY(1px)}
    .card{
      margin-top:18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
      border:1px solid rgba(255,255,255,0.08);
      border-radius:28px;
      padding:22px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    }
    .card h2{margin:0 0 14px; font-size: clamp(40px, 5vw, 72px); letter-spacing:-0.02em}
    .mini{color:var(--muted); font-size:18px; margin-top:6px}
    .nowbox{
      margin-top:12px;
      border-radius:26px;
      padding:20px;
      background: rgba(0,0,0,0.18);
      border:1px solid rgba(255,255,255,0.08);
      display:flex; gap:18px; align-items:center;
      min-height:140px;
    }
    .cover{
      width:110px; height:110px; border-radius:22px;
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.10);
      flex:0 0 auto;
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    .cover img{width:100%; height:100%; object-fit:cover}
    .meta{display:flex; flex-direction:column; gap:6px}
    .track{font-size:26px; font-weight:800}
    .artist{font-size:20px; color:var(--muted); font-weight:650}
    .err{margin-top:10px; color:#ffb3b3; font-weight:700}
    .list{display:flex; flex-direction:column; gap:10px; margin-top:8px}
    .item{
      display:flex; justify-content:space-between; gap:14px;
      padding:12px 14px; border-radius:16px;
      background: rgba(0,0,0,0.18);
      border:1px solid rgba(255,255,255,0.07);
      font-size:18px;
    }
    .item .left{display:flex; flex-direction:column}
    .item .name{font-weight:800}
    .item .sub{color:var(--muted); font-size:14px; margin-top:2px}
    .item .plays{color:var(--muted); font-weight:750; white-space:nowrap}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Listening Mirror</h1>

    <div class="row">
      <div class="dot" title="online"></div>
      <button class="pill" id="btnNow">Now</button>
      <button class="pill" id="btnToday">Today</button>
      <button class="pill" id="btnWeek">Week</button>
      <button class="pill" id="btnReflection">Reflection</button>
    </div>

    <div class="card" id="panelNow">
      <h2>Now Playing</h2>
      <div class="nowbox">
        <div class="cover" id="nowCover"></div>
        <div class="meta">
          <div class="track" id="nowTrack">—</div>
          <div class="artist" id="nowArtist"></div>
          <div class="mini" id="nowInfo"></div>
        </div>
      </div>
      <div class="err" id="nowErr"></div>
    </div>
    <div class="card hidden" id="panelToday">
      <h2>Today Top Tracks</h2>
      <div class="list" id="todayList"></div>
      <div class="err" id="todayErr"></div>
    </div>

    <div class="card hidden" id="panelWeek">
      <h2>Week Top Tracks</h2>
      <div class="list" id="weekList"></div>
      <div class="err" id="weekErr"></div>
    </div>

    <div class="card hidden" id="panelReflection">
      <h2>Reflection</h2>
      <div class="mini">AI reflection based strictly on your Last.fm data.</div>
      <div class="nowbox" style="align-items:flex-start">
        <div class="meta" style="gap:10px; width:100%">
          <div class="track" style="font-size:22px" id="refText">—</div>
        </div>
      </div>
      <div class="err" id="refErr"></div>
    </div>

  </div>

<script>
  // IMPORTANT: αυτό πρέπει να είναι το Worker σου
  const API_BASE = "https://i.errtanq9.workers.dev";

  const $ = (id) => document.getElementById(id);

  function show(panelId){
    ["panelNow","panelToday","panelWeek","panelReflection"].forEach(id=>{
      $(id).classList.toggle("hidden", id !== panelId);
    });
  }

  async function getJSON(url){
    const r = await fetch(url, { method:"GET" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function setCover(el, url){
    el.innerHTML = "";
    if(!url){ el.textContent = ""; return; }
    const img = document.createElement("img");
    img.src = url;
    img.alt = "cover";
    el.appendChild(img);
  }

  function renderList(container, tracks){
    container.innerHTML = "";
    tracks.forEach((t, idx) => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="left">
          <div class="name">${idx+1}. ${escapeHTML(t.name)}</div>
          <div class="sub">${escapeHTML(t.artist)}</div>
        </div>
        <div class="plays">${t.playcount} plays</div>
      `;
      container.appendChild(row);
    });
  }

  function escapeHTML(s){
    return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  async function loadNow(){
    $("nowErr").textContent = "";
    $("nowTrack").textContent = "—";
    $("nowArtist").textContent = "";
    $("nowInfo").textContent = "";
    setCover($("nowCover"), null);

    try{
      const data = await getJSON(`${API_BASE}/api/now`);
      if(!data?.track){ throw new Error("No data"); }
      $("nowTrack").textContent = data.track.name || "—";
      $("nowArtist").textContent = data.track.artist || "";
      $("nowInfo").textContent = data.track.nowplaying ? "Now playing" : "Last played";
      setCover($("nowCover"), data.track.image || null);
    }catch(e){
      $("nowErr").textContent = "Failed to load.";
    }
  }

  async function loadTop(period, listElId, errElId){
    $(errElId).textContent = "";
    $(listElId).innerHTML = "";
    try{
      const data = await getJSON(`${API_BASE}/api/top?type=tracks&period=${period}&limit=10`);
      if(!data?.tracks) throw new Error("No tracks");
      renderList($(listElId), data.tracks);
    }catch(e){
      $(errElId).textContent = "Failed to load.";
    }
  }

  async function loadReflection(){
    $("refErr").textContent = "";
    $("refText").textContent = "—";
    try{
      const data = await getJSON(`${API_BASE}/api/reflection?period=7day&limit=10`);
      $("refText").textContent = data?.text || "No reflection.";
    }catch(e){
      $("refErr").textContent = "Failed to load reflection.";
    }
  }

  $("btnNow").onclick = () => { show("panelNow"); loadNow(); };
  $("btnToday").onclick = () => { show("panelToday"); loadTop("1day","todayList","todayErr"); };
  $("btnWeek").onclick = () => { show("panelWeek"); loadTop("7day","weekList","weekErr"); };
  $("btnReflection").onclick = () => { show("panelReflection"); loadReflection(); };

  // initial
  show("panelNow");
  loadNow();
</script>

</body>
</html>
