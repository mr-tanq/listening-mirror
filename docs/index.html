<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --card:rgba(255,255,255,.06);
      --txt:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.58);
      --stroke:rgba(255,255,255,.10);
      --radius:28px;
      --shadow: 0 12px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 30% 10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(255,255,255,.08), transparent 55%),
        var(--bg);
      color:var(--txt);
    }
    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px;}
    h1{font-size:56px;letter-spacing:-1px;margin:18px 0 10px;}

    .tabs{
      display:flex; gap:12px; align-items:center;
      margin:10px 0 12px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:6px;
    }
    .tabs::-webkit-scrollbar{height:6px}
    .tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:999px}
    .dot{flex:0 0 auto;width:18px;height:18px;border-radius:999px;background:#38d06e;
      box-shadow:0 0 0 6px rgba(56,208,110,.12)}
    .tab{
      flex:0 0 auto;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      color:var(--txt);
      padding:10px 18px;border-radius:999px;
      font-weight:800; cursor:pointer; user-select:none;
      white-space:nowrap;
    }
    .tab[aria-selected="true"]{
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border-color:rgba(255,255,255,.18);
    }

    .panel{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .panel h2{font-size:48px;margin:6px 0 14px;letter-spacing:-1px}

    .card{border:1px solid var(--stroke); background:rgba(0,0,0,.22);
      border-radius:22px; padding:16px;}

    .muted{color:var(--muted); font-weight:750}

    .row{
      display:grid;
      grid-template-columns: 44px 56px 1fr auto;
      gap:12px; align-items:center;
      padding:14px 14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.22);
      margin-bottom:12px;
    }
    .rank{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      border:1px solid var(--stroke);
      color:rgba(255,255,255,.55);
      font-weight:900;
      background:rgba(255,255,255,.04);
    }
    .mini{
      width:56px;height:56px;border-radius:16px;
      border:1px solid var(--stroke);
      overflow:hidden;
      background:rgba(255,255,255,.08);
      display:grid;place-items:center;
    }
    .mini img{width:100%;height:100%;object-fit:cover;display:block;}
    .rowTitle{font-weight:900; line-height:1.18; font-size:18px;}
    .rowSub{color:rgba(255,255,255,.42); font-weight:750; margin-top:4px; font-size:14px;}
    .count{color:rgba(255,255,255,.60); font-weight:900; white-space:nowrap; font-variant-numeric: tabular-nums;}

    .ph{
      width:100%;height:100%;
      display:grid;place-items:center;
      background:
        radial-gradient(120px 120px at 30% 20%, rgba(255,255,255,.12), transparent 55%),
        radial-gradient(160px 120px at 70% 80%, rgba(255,255,255,.10), transparent 60%),
        rgba(255,255,255,.06);
    }
    .ph svg{width:26px;height:26px;opacity:.55;}
    .nowGrid{display:grid; grid-template-columns: 120px 1fr; gap:16px; align-items:center;}
    .cover{width:120px;height:120px;border-radius:18px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.08);overflow:hidden;display:grid;place-items:center;}
    .cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .title{font-size:22px;font-weight:900;line-height:1.15;}
    .sub{margin-top:6px;color:var(--muted);font-weight:750;}

    @media (max-width: 640px){
      h1{font-size:44px;margin:10px 0 8px;}
      .panel{padding:16px;border-radius:24px;}
      .panel h2{font-size:40px}
      .nowGrid{grid-template-columns: 92px 1fr; gap:12px;}
      .cover{width:92px;height:92px;border-radius:16px;}
      .title{font-size:18px}
      .sub{font-size:14px}
      .row{grid-template-columns: 40px 52px 1fr; grid-template-areas:"rank art meta" "rank art count";}
      .rank{grid-area:rank;width:40px;height:40px}
      .mini{grid-area:art;width:52px;height:52px}
      .count{grid-area:count;justify-self:end;align-self:end}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Listening Mirror</h1>

    <div class="tabs">
      <div class="dot" aria-hidden="true"></div>
      <div class="tab" data-tab="now" aria-selected="true">Now</div>
      <div class="tab" data-tab="today" aria-selected="false">Today</div>
      <div class="tab" data-tab="week" aria-selected="false">Week</div>
    </div>

    <section class="panel" data-panel="now">
      <h2>Now Playing</h2>
      <div class="card">
        <div class="nowGrid">
          <div class="cover" id="nowCover"></div>
          <div>
            <div class="title" id="nowTitle">Loading…</div>
            <div class="sub" id="nowAlbum"></div>
            <div class="muted" id="nowHint" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="today" style="display:none;">
      <h2>Today</h2>
      <div id="todayList"></div>
      <div class="muted" id="todayEmpty" style="display:none;margin-top:14px;">No data yet.</div>
    </section>

    <section class="panel" data-panel="week" style="display:none;">
      <h2>Top tracks</h2>
      <div id="weekTracks"></div>

      <div style="height:18px"></div>

      <h2 style="font-size:40px;margin-top:10px;">Top artists</h2>
      <div id="weekArtists"></div>
    </section>
  </div>

  <script>
    const DEFAULT_API = "https://i.errtanq9.workers.dev";

    const qsApi = new URL(location.href).searchParams.get("api");
    const storedApi = localStorage.getItem("BASE_API");
    const BASE_API = (qsApi || storedApi || DEFAULT_API).replace(/\/+$/,"");
    if (qsApi) localStorage.setItem("BASE_API", BASE_API);

    const $ = (id) => document.getElementById(id);

    function setTab(name){
      document.querySelectorAll(".tab").forEach(t=>{
        t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false");
      });
      document.querySelectorAll("[data-panel]").forEach(p=>{
        p.style.display = (p.dataset.panel === name) ? "" : "none";
      });
    }

    document.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        const name = t.dataset.tab;
        setTab(name);
        if (name === "now") loadNow();
        if (name === "today") loadToday();
        if (name === "week") loadWeek();
      });
    });

    async function fetchJSON(path, opts = {}){
      const url = BASE_API + path;
      const r = await fetch(url, { ...opts, mode:"cors", cache:"no-store" });
      const text = await r.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      if (!r.ok) {
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : text;
        throw new Error(`HTTP ${r.status} @ ${path} :: ${msg}`.slice(0,300));
      }
      return data;
    }

    function placeholderHTML(){
      return `
        <div class="ph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 18V6.7c0-.4.24-.76.6-.92l8-3.6c.66-.3 1.4.18 1.4.9V15.5c0 1.66-1.79 3-4 3s-4-1.34-4-3 1.79-3 4-3c.75 0 1.46.16 2.06.44V5.3L11 8.1V18c0 1.66-1.79 3-4 3s-4-1.34-4-3 1.79-3 4-3c.75 0 1.46.16 2 .43Z" fill="rgba(255,255,255,.78)"/>
          </svg>
        </div>
      `;
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    // NOW
    async function loadNow(){
      $("nowHint").textContent = "";
      try{
        const d = await fetchJSON("/api/now");
        const title = d.artist ? `${d.artist} — ${d.name}` : (d.name || "—");
        $("nowTitle").textContent = title || "—";
        $("nowAlbum").textContent = d.album || "";
        $("nowCover").innerHTML = d.image ? `<img src="${esc(d.image)}" alt="" loading="lazy" />` : placeholderHTML();
        $("nowHint").textContent = d.nowPlaying ? "LIVE now playing" : "";
      }catch(e){
        $("nowTitle").textContent = "Failed to load.";
        $("nowAlbum").textContent = "";
        $("nowCover").innerHTML = placeholderHTML();
        $("nowHint").textContent = e.message || "Check Worker + CORS.";
      }
    }

    // TODAY
    async function loadToday(){
      const listEl = $("todayList");
      const emptyEl = $("todayEmpty");
      listEl.innerHTML = "";
      emptyEl.style.display = "none";

      try{
        const d = await fetchJSON("/api/recent?limit=40");
        const tracks = d.tracks || [];
        if (!tracks.length){ emptyEl.style.display=""; return; }

        tracks.slice(0, 30).forEach((t, i)=>{
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div class="rank">${i+1}</div>
            <div class="mini">${t.image ? `<img src="${esc(t.image)}" alt="" loading="lazy">` : placeholderHTML()}</div>
            <div>
              <div class="rowTitle">${esc(`${t.artist} — ${t.name}`)}</div>
              <div class="rowSub">${esc(t.album || "")}</div>
            </div>
            <div class="count">${t.nowPlaying ? "LIVE" : ""}</div>
          `;
          listEl.appendChild(row);
        });
      }catch(e){
        emptyEl.style.display="";
        emptyEl.textContent = "Failed to load: " + (e.message || "");
      }
    }

    // WEEK (artwork fallback from RECENT like Now/Today)
    async function loadWeek(){
      $("weekTracks").innerHTML = "";
      $("weekArtists").innerHTML = "";

      // 1) fetch recent map for artwork fallback (same source as Now/Today)
      let recentMap = new Map();
      try{
        const r = await fetchJSON("/api/recent?limit=200");
        const recent = r.tracks || [];
        for (const t of recent){
          // key by track name (simple & robust for your use)
          if (t?.name && t?.image && !recentMap.has(t.name)) {
            recentMap.set(t.name, t.image);
          }
        }
      }catch(e){
        // ignore: week can still load without fallback
      }

      // 2) Top tracks
      try{
        const d = await fetchJSON("/api/top?type=tracks&period=7day&limit=12");
        (d.tracks || []).forEach((t, i)=>{
          const img = t.image || recentMap.get(t.name) || "";
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div class="rank">${i+1}</div>
            <div class="mini">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : placeholderHTML()}</div>
            <div>
              <div class="rowTitle">${esc(t.name || "")}</div>
              <div class="rowSub"></div>
            </div>
            <div class="count">${(t.playcount||0)}</div>
          `;
          $("weekTracks").appendChild(row);
        });
      }catch(e){
        const m = document.createElement("div");
        m.className="muted";
        m.textContent="Failed to load top tracks: " + (e.message || "");
        $("weekTracks").appendChild(m);
      }

      // 3) Top artists
      try{
        const d2 = await fetchJSON("/api/top?type=artists&period=7day&limit=10");
        (d2.artists || []).forEach((a, i)=>{
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div class="rank">${i+1}</div>
            <div class="mini">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : placeholderHTML()}</div>
            <div>
              <div class="rowTitle">${esc(a.name || "")}</div>
              <div class="rowSub"></div>
            </div>
            <div class="count">${(a.playcount||0)}</div>
          `;
          $("weekArtists").appendChild(row);
        });
      }catch(e){
        const m = document.createElement("div");
        m.className="muted";
        m.textContent="Failed to load top artists: " + (e.message || "");
        $("weekArtists").appendChild(m);
      }
    }

    // initial
    loadNow();
  </script>
</body>
</html>
