<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Listening Mirror</title>

<style>

:root{
  --bg:#0b0c0e;
  --card:#14161a;
  --text:#e9e9ea;
  --muted:#a8abb2;
  --line:#242830;
  --pill:#1a1d22;
  --pillActive:#23262d;
  --accent:#ffffff;
  --live:#ff4d4d;
  --radius:22px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.wrapper{
  max-width:720px;
  margin:0 auto;
  padding:18px 16px 40px;
}

/* HEADER */

.header{
  margin-bottom:16px;
}

.title{
  font-size:24px;
  font-weight:700;
  letter-spacing:.2px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#25d366;
  box-shadow:0 0 8px #25d366aa;
}

/* MAIN TABS */

.tabs{
  display:flex;
  gap:10px;
  margin:18px 0 18px;
}

.tab{
  padding:10px 18px;
  border-radius:999px;
  background:var(--pill);
  color:var(--muted);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  border:1px solid transparent;
  transition:.18s;
}

.tab.active{
  background:var(--pillActive);
  color:#fff;
  border:1px solid #3a3d45;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}

/* NOW CARD */

.nowCard{
  position:relative;
  border-radius:26px;
  overflow:hidden;
  min-height:170px;
  display:flex;
  align-items:flex-end;
  padding:18px;
  background:#111;
}

.nowArtwork{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:0;
}

/* bottom shelf gradient */
.nowCard::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48%;
  background:linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.45), transparent);
  z-index:1;
}

.nowInfo{
  position:relative;
  z-index:2;
}

.track{
  font-size:20px;
  font-weight:700;
  margin-bottom:4px;
}

.artist{
  color:#d0d3da;
  font-size:15px;
}

.album{
  color:#9aa0aa;
  font-size:13px;
}

/* LIVE CHIP */

.live{
  position:absolute;
  top:14px;
  right:14px;
  z-index:3;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,80,80,.7);
  color:#fff;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:6px;
  backdrop-filter:blur(6px);
}

.liveDot{
  width:8px;
  height:8px;
  background:var(--live);
  border-radius:50%;
  box-shadow:0 0 8px var(--live);
}

/* LIST */

.list{
  margin-top:18px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 4px;
  border-bottom:1px solid #181a1f;
}

.row img{
  width:46px;
  height:46px;
  border-radius:12px;
  object-fit:cover;
}

.rowText{
  display:flex;
  flex-direction:column;
}

.rowTitle{
  font-weight:600;
}

.rowSub{
  color:var(--muted);
  font-size:13px;
}

</style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <div class="title">Listening Mirror</div>
    <div class="status">
      <div class="dot"></div>
      Online
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="now">Now</div>
    <div class="tab" data-tab="top">Top</div>
    <div class="tab" data-tab="recent">Recent</div>
  </div>

  <div class="nowCard" id="nowCard">
    <div class="nowArtwork" id="nowArtwork"></div>

    <div class="live">
      <div class="liveDot"></div>
      LIVE
    </div>

    <div class="nowInfo">
      <div class="track" id="nowTrack">—</div>
      <div class="artist" id="nowArtist">—</div>
      <div class="album" id="nowAlbum">—</div>
    </div>
  </div>

  <div class="list" id="list"></div>

</div>

<script src="app.js"></script>
</body>
</html>
