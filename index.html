<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Mirror</title>

<style>
body{
background:#0b0b0b;
color:#eaeaea;
font-family:system-ui;
margin:0;
padding:20px;
}

.card{
background:#141414;
border-radius:16px;
padding:16px;
margin-bottom:16px;
border:1px solid #2a2a2a;
}

h1{margin-top:0;}
.small{opacity:.7;font-size:13px;}
.track{margin:6px 0;}
</style>
</head>

<body>

<h1>Listening Mirror</h1>
<div class="small">connected to last.fm user: errz</div>

<div class="card">
<h2>Today</h2>
<div id="today">loading…</div>
</div>

<div class="card">
<h2>Top artists (recent)</h2>
<div id="artists">loading…</div>
</div>

<script>

const API_KEY = "PASTE_YOUR_LASTFM_KEY_HERE";
const USER = "errz";

async function fetchRecent(){
const url=`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USER}&api_key=${API_KEY}&format=json&limit=50`;
const res=await fetch(url);
return await res.json();
}

async function fetchArtists(){
const url=`https://ws.audioscrobbler.com/2.0/?method=user.gettopartists&user=${USER}&api_key=${API_KEY}&format=json&period=7day&limit=10`;
const res=await fetch(url);
return await res.json();
}

async function init(){

const recent=await fetchRecent();

let todayHTML="";
const tracks=recent.recenttracks.track;

tracks.forEach(t=>{
if(!t["@attr"]){ // όχι now playing
todayHTML+=`<div class="track">${t.artist["#text"]} — ${t.name}</div>`;
}
});

document.getElementById("today").innerHTML=todayHTML;

const artists=await fetchArtists();

let artistsHTML="";
artists.topartists.artist.forEach(a=>{
artistsHTML+=`<div class="track">${a.name} (${a.playcount})</div>`;
});

document.getElementById("artists").innerHTML=artistsHTML;
}

init();

</script>

</body>
</html>
