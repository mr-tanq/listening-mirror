<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Mirror</title>

<style>
body{
background:#0b0b0c;
color:#e8e8ea;
font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;
margin:0;
padding:24px;
}

h1{
margin:0 0 6px;
font-size:28px;
}

.subhead{
opacity:.6;
margin-bottom:18px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:18px;
}

.tab{
padding:8px 14px;
border-radius:999px;
border:1px solid #2a2a2a;
cursor:pointer;
opacity:.7;
}

.tab.active{
background:#1b1b1d;
opacity:1;
}

.card{
background:#131315;
border:1px solid #232326;
border-radius:16px;
padding:14px;
margin-bottom:16px;
}

.row{
display:flex;
gap:14px;
align-items:center;
}

.cover{
width:110px;
height:110px;
border-radius:12px;
border:1px solid #2a2a2a;
object-fit:cover;
background:#0d0d0d;
}

.meta{
min-width:0;
}

.title{
font-size:16px;
font-weight:650;
margin:0 0 6px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.sub{
margin:0;
opacity:.75;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.list div{
margin:6px 0;
opacity:.9;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#ff4d4d;
display:inline-block;
margin-right:8px;
}
</style>
</head>

<body>

<h1>Listening Mirror</h1>
<div class="subhead">connected to last.fm user: errz</div>

<div><span id="statusdot" class="dot"></span><span id="statustext">connecting...</span></div>

<div class="tabs">
<div class="tab active" id="tab-now">Now</div>
<div class="tab" id="tab-today">Today</div>
<div class="tab" id="tab-week">Week</div>
</div>

<div id="now" class="card">
<h2>Now Playing</h2>
<div id="nowcontent">loading...</div>
</div>

<div id="today" class="card" style="display:none">
<h2>Today</h2>
<div id="todaylist" class="list"></div>
</div>

<div id="week" class="card" style="display:none">
<h2>Top Tracks</h2>
<div id="weeklist" class="list"></div>
</div>

<script>

const API="https://i.errtanq9.workers.dev";

async function loadNow(){
try{
const r=await fetch(API+"/now");
const j=await r.json();

document.getElementById("statustext").textContent="online";

document.getElementById("nowcontent").innerHTML=
`<div class="row">
<img class="cover" src="${j.image}">
<div class="meta">
<div class="title">${j.artist} — ${j.name}</div>
<div class="sub">${j.album||""}</div>
</div>
</div>`;

}catch{
document.getElementById("statustext").textContent="error";
document.getElementById("nowcontent").textContent="Failed to fetch";
}
}

async function loadToday(){
const r=await fetch(API+"/today");
const j=await r.json();
const el=document.getElementById("todaylist");
el.innerHTML="";
j.forEach(t=>{
const d=document.createElement("div");
d.textContent=t.artist+" — "+t.name;
el.appendChild(d);
});
}

async function loadWeek(){
const r=await fetch(API+"/week");
const j=await r.json();
const el=document.getElementById("weeklist");
el.innerHTML="";
j.forEach(t=>{
const d=document.createElement("div");
d.textContent=t.artist+" — "+t.name;
el.appendChild(d);
});
}

document.getElementById("tab-now").onclick=()=>{
now.style.display="block";
today.style.display="none";
week.style.display="none";
};

document.getElementById("tab-today").onclick=()=>{
now.style.display="none";
today.style.display="block";
week.style.display="none";
loadToday();
};

document.getElementById("tab-week").onclick=()=>{
now.style.display="none";
today.style.display="none";
week.style.display="block";
loadWeek();
};

loadNow();
setInterval(loadNow,15000);

</script>
</body>
</html>
