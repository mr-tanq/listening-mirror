<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --bg2:#090a0c;
      --card: rgba(255,255,255,.055);
      --card2: rgba(255,255,255,.035);
      --text:#ececee;
      --muted:#a7abb4;
      --muted2:#7d828d;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r: 22px;

      --live:#ff3b3b;
      --liveBg: rgba(255,59,59,.10);
      --liveBd: rgba(255,59,59,.30);

      --safeL: max(14px, env(safe-area-inset-left));
      --safeR: max(14px, env(safe-area-inset-right));
      --safeT: max(14px, env(safe-area-inset-top));
      --safeB: max(14px, env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    html{ overscroll-behavior-y:none; }
    body{
      margin:0;
      overflow-x:hidden;
      overscroll-behavior-y:none;
      background:
        radial-gradient(1200px 700px at 25% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(255,255,255,.04), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .app{
      min-height:100%;
      padding: calc(var(--safeT) + 14px) var(--safeR) calc(var(--safeB) + 18px) var(--safeL);
      max-width: 920px;
      margin: 0 auto;
    }

    header{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 2px;
    }

    .glyph{
      width: 16px;
      height: 16px;
      border-radius: 999px;
      position:relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,.05) 55%, rgba(255,255,255,.03) 70%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      flex: 0 0 auto;
    }
    .glyph:before{
      content:"";
      position:absolute;
      inset:3px;
      border-radius: 999px;
      outline: 1px solid rgba(255,255,255,.10);
      background: radial-gradient(circle at 65% 35%, rgba(255,255,255,.10), transparent 60%);
      opacity:.9;
    }

    .wordmark{
      display:flex;
      flex-direction:column;
      line-height: 1.15;
    }
    .wordmark .title{
      font-size: 18px;
      font-weight: 720;
      letter-spacing: .35px;
      margin:0;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.70));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .wordmark .sub{
      margin-top: 6px;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted2);
      font-size: 12px;
      letter-spacing: .2px;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.14);
      outline: 1px solid rgba(255,255,255,.10);
    }
    .dot.on{
      background: rgba(49,208,124,.75);
      outline-color: rgba(49,208,124,.35);
      box-shadow: 0 0 0 3px rgba(49,208,124,.10);
    }

    /* Tabs — πιο “μαζεμένα” + pro spacing */
    .tabs{
      display:flex;
      gap:10px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      width: fit-content;
      margin: 12px 0 16px 0;
    }
    .tabBtn{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.72);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .2px;
      cursor:pointer;
    }
    .tabBtn[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .panel{ display:block; }
    .hidden{ display:none; }

    .card{
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--card), var(--card2));
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    /* NOW background — SHARP artwork (λίγο πιο “έντονο”, όχι αχνό) */
    .nowAmbient{
      position:absolute;
      inset:-1px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .22s ease;
    }
    .nowAmbient.on{ opacity: 1; }
    .nowAmbient:before{
      content:"";
      position:absolute;
      inset:0;
      background-image: var(--ambient-url, none);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02);
      opacity: .95;
      filter: saturate(1.02) contrast(1.02);
    }
    .nowAmbient:after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 520px at 18% 8%, rgba(255,255,255,.10), transparent 55%),
        radial-gradient(700px 420px at 85% 10%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, rgba(8,9,11,.50), rgba(8,9,11,.92));
    }

    .nowWrap{ position:relative; padding: 18px; }
    .nowTop{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      margin-bottom: 14px;
      position:relative;
      z-index:2;
      min-height: 24px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      outline: 1px solid rgba(255,255,255,.085);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing:.25px;
      white-space:nowrap;
    }
    .chip .miniDot{ width:6px;height:6px;border-radius:999px; background: rgba(255,255,255,.18); }
    .chip.live{
      color: rgba(255,255,255,.95);
      outline-color: var(--liveBd);
      background: var(--liveBg);
    }
    .chip.live .miniDot{
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(255,59,59,.12);
    }

    /* NOW content is single column (no square cover) */
    .nowMain{
      display:grid;
      grid-template-columns: 1fr;
      gap: 0;
      align-items:center;
      position:relative;
      z-index:2;
    }
    /* kept for app.js compatibility, but hidden */
    .coverWrap{ display:none !important; }

    .nowText{ min-width:0; padding-left: 2px; }
    .line1{ font-size: 15.5px; font-weight: 720; letter-spacing: .15px; }
    .line2{ margin-top: 6px; font-size: 13.5px; color: rgba(255,255,255,.72); }
    .line3{ margin-top: 6px; font-size: 12px; color: var(--muted2); }

    /* Marquee: fade only on RIGHT */
    .marq{ display:inline-block; white-space:nowrap; will-change:transform; }
    .marqWrap{
      position:relative;
      overflow:hidden;
      padding-left: 3px;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
    }
    .marqOn .marq{ animation: marqMove var(--marqDur, 10s) linear infinite; }
    @keyframes marqMove{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(calc(-1 * var(--marqShift, 60px))); }
    }

    .controls{
      padding: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .seg{
      display:flex;
      gap:8px;
      padding: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      width: fit-content;
    }
    .seg button{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.74);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor:pointer;
      letter-spacing:.2px;
    }
    .seg button[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .list{ padding: 10px; }

    .row{
      display:grid;
      grid-template-columns: 52px minmax(0,1fr) max-content;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 16px;
      align-items:center;
      user-select:none;
    }
    .row:hover{ background: rgba(255,255,255,.035); }
    .row:active{ background: rgba(255,255,255,.045); }

    .thumb{
      width: 44px; height: 44px;
      border-radius: 14px;
      overflow:hidden;
      position:relative;
      outline: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.40);
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumbFallback{
      position:absolute; inset:0; display:grid; place-items:center;
      color: rgba(255,255,255,.35); font-size: 18px;
    }

    .mid{ min-width:0; padding-left: 3px; }
    .title{
      font-size: 13.5px;
      font-weight: 650;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right{
      justify-self:end;
      text-align:right;
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(255,255,255,.80);
      padding-left: 8px;
      white-space:nowrap;
    }
    .right.count{
      color: rgba(255,214,102,.92);
    }

    /* --------------------------
       MIRROR CARD + ORB + POPUP
       -------------------------- */
    .mirrorCard{ margin-top: 16px; } /* λίγο πιο “editorial” spacing */
    .mirrorWrap{ padding: 16px 18px 18px 18px; position:relative; }

    .mirrorTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 12px;
    }

    /* πιο subtle “MIRROR” label */
    .mirrorTitle{
      font-size: 11.5px;
      letter-spacing: .34px;
      color: rgba(255,255,255,.62);
      text-transform: uppercase;
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

    /* Orb as <details> summary (popup) */
    .orbDetails{
      position:relative;
      display:inline-block;
    }
    .orbDetails summary{
      list-style:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      outline:none;
    }
    .orbDetails summary::-webkit-details-marker{ display:none; }
    .orbDetails summary:focus-visible{
      box-shadow: 0 0 0 3px rgba(255,255,255,.12);
      border-radius: 999px;
    }

    /* ✅ The Orb */
    .orb{
      width: 18px;
      height: 18px;
      border-radius: 999px;
      position:relative;
      flex: 0 0 auto;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.28), rgba(255,255,255,.09) 55%, rgba(255,255,255,.05) 75%),
        radial-gradient(circle at 70% 65%, rgba(255,255,255,.10), transparent 60%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
    }
    .orb:after{
      content:"";
      position:absolute;
      inset: -6px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.10), transparent 60%);
      opacity: .55;
      filter: blur(2px);
      pointer-events:none;
    }
    /* breathing when listening */
    .orb.on{
      animation: orbBreath 1.9s ease-in-out infinite;
      outline-color: rgba(49,208,124,.22);
    }
    @keyframes orbBreath{
      0%,100%{
        transform: scale(1);
        box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 0 rgba(49,208,124,.00);
      }
      50%{
        transform: scale(1.05);
        box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 10px rgba(49,208,124,.06);
      }
    }

    /* Orb popup window */
    .orbPopup{
      position:absolute;
      top: calc(100% + 10px);
      left: 0;
      width: min(320px, calc(100vw - 40px));
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(22,24,28,.92), rgba(14,16,19,.92));
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 22px 70px rgba(0,0,0,.62);
      padding: 12px 12px 12px 12px;
      z-index: 10;
      transform-origin: 12px 0;
      transform: translateY(-4px) scale(.98);
      opacity: 0;
      pointer-events:none;
      transition: opacity .16s ease, transform .16s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .orbDetails[open] .orbPopup{
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events:auto;
    }
    .orbPopup:before{
      content:"";
      position:absolute;
      top:-7px;
      left: 16px;
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: rgba(22,24,28,.92);
      outline: 1px solid rgba(255,255,255,.10);
      border-radius: 4px;
    }
    .orbPopupTitle{
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .25px;
      color: rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
    }
    .orbPopupHint{
      font-size: 11px;
      color: rgba(255,255,255,.58);
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .orbPopupGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .orbMini{
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      outline: 1px solid rgba(255,255,255,.07);
      padding: 10px 10px 10px 10px;
    }
    .orbMiniLbl{
      font-size: 10px;
      letter-spacing: .28px;
      color: rgba(255,255,255,.60);
      text-transform: uppercase;
    }
    .orbMiniVal{
      margin-top: 8px;
      font-size: 13px;
      font-weight: 760;
      color: rgba(255,255,255,.90);
    }

    .mirrorPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing: .2px;
      white-space:nowrap;
    }
    .mirrorPill .miniDot{
      width:6px;height:6px;border-radius:999px;
      background: rgba(255,255,255,.20);
    }
    .mirrorPill.on{
      background: rgba(49,208,124,.10);
      outline-color: rgba(49,208,124,.22);
      color: rgba(255,255,255,.92);
    }
    .mirrorPill.on .miniDot{
      background: rgba(49,208,124,.85);
      box-shadow: 0 0 0 3px rgba(49,208,124,.10);
    }

    .mirrorState{
      font-size: 18px;
      font-weight: 760;
      letter-spacing: .12px;
      margin: 6px 0 14px 0;
      color: rgba(255,255,255,.94);
    }

    .meters{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-bottom: 14px;
    }
    .meter{
      border-radius: 16px;
      background: rgba(255,255,255,.028);
      outline: 1px solid rgba(255,255,255,.07);
      padding: 10px 10px 11px 10px;
      overflow:hidden;
    }
    .meterLbl{
      font-size: 11px;
      letter-spacing: .25px;
      color: rgba(255,255,255,.62);
      text-transform: uppercase;
    }
    .meterVal{
      margin-top: 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    /* bar = πιο high-end (λιγότερο “άσπρο πλαστικό”) */
    .bar{
      height: 6px;
      flex: 1 1 auto;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      overflow:hidden;
      outline: 1px solid rgba(255,255,255,.06);
    }
    .bar > i{
      display:block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.38));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
    }

    .meterNum{
      font-size: 12px;
      font-weight: 750;
      color: rgba(255,255,255,.82);
      white-space:nowrap;
    }
.mood{
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      outline: 1px solid rgba(255,255,255,.07);
      padding: 12px 12px 12px 12px;
    }
    .moodTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .moodLbl{
      font-size: 11px;
      letter-spacing: .25px;
      color: rgba(255,255,255,.62);
      text-transform: uppercase;
    }
    .moodAxis{
      font-size: 11px;
      color: rgba(255,255,255,.55);
      white-space:nowrap;
    }
    .moodBar{
      position:relative;
      height: 10px;
      border-radius: 999px;
      background:
        linear-gradient(90deg,
          rgba(255,255,255,.18),
          rgba(255,255,255,.09),
          rgba(255,255,255,.20));
      outline: 1px solid rgba(255,255,255,.07);
      overflow:hidden;
    }
    .moodDot{
      position:absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 0 0 4px rgba(255,255,255,.10);
      outline: 1px solid rgba(0,0,0,.25);
    }

    .stack{
      margin-top: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .stackLbl{
      font-size: 11px;
      letter-spacing: .25px;
      color: rgba(255,255,255,.55);
      text-transform: uppercase;
    }

    /* session covers = λίγο πιο “άνετα” δεξιά + λιγότερο overlap */
    .covers{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:0;
      padding-right: 2px;
    }
    .cvr{
      width: 28px; height: 28px;
      border-radius: 10px;
      overflow:hidden;
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
      background: rgba(255,255,255,.05);
      margin-left: -6px;
    }
    .cvr:first-child{ margin-left: 0; }
    .cvr img{ width:100%; height:100%; object-fit:cover; display:block; }

    @media (max-width: 520px){
      .tabs{ width: 100%; justify-content: space-between; }
      .line1{ font-size: 15px; }
      .meters{ grid-template-columns: 1fr; }
      .orbPopup{ left: 0; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="glyph" aria-hidden="true"></div>
        <div class="wordmark">
          <div class="title">Listening Mirror</div>
          <div class="sub">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusLine">Offline</span>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true" role="tab">Now</button>
      <button class="tabBtn" data-tab="top" aria-selected="false" role="tab">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false" role="tab">Recent</button>
    </div>

    <section class="panel" data-panel="now">
      <!-- NOW -->
      <div class="card">
        <div id="nowAmbient" class="nowAmbient"></div>

        <div class="nowWrap">
          <div class="nowTop">
            <div id="nowBadge" class="chip">
              <span class="miniDot" aria-hidden="true"></span>
              <span id="nowBadgeText">OFF</span>
            </div>
          </div>

          <div class="nowMain">
            <!-- kept for app.js compatibility, but hidden by CSS -->
            <div class="coverWrap" id="nowCoverWrap">
              <img id="nowImg" class="coverImg" alt="" />
              <div id="nowFallback" class="coverFallback">♪</div>
            </div>

            <div class="nowText">
              <div class="line1 marqWrap" id="nowTrackWrap">
                <span class="marq" id="nowTrack">—</span>
              </div>
              <div class="line2 marqWrap" id="nowArtistWrap">
                <span class="marq" id="nowArtist">—</span>
              </div>
              <div class="line3 marqWrap" id="nowAlbumWrap">
                <span class="marq" id="nowAlbum">—</span>
              </div>
              <div class="sub" id="nowMsg" style="margin-top:12px;">—</div>
            </div>
          </div>
        </div>
      </div>

      <!-- MIRROR (always visible) -->
      <div class="card mirrorCard" id="mirrorCard">
        <div class="mirrorWrap">
          <div class="mirrorTop">
            <div class="mirrorTitle">
              <!-- Orb + Popup (tap on orb area) -->
              <details class="orbDetails" id="orbDetails">
                <summary aria-label="Open Mirror popup">
                  <span id="mirrorOrb" class="orb" aria-hidden="true"></span>
                  Mirror
                </summary>

                <div class="orbPopup" role="dialog" aria-label="Mirror popup">
                  <div class="orbPopupTitle">
                    <span>Listening Mirror</span>
                    <span style="font-size:11px;color:rgba(255,255,255,.55)">tap orb again</span>
                  </div>
                  <div class="orbPopupHint">
                    Quick view of the live session signals. (Later εδώ μπορεί να μπει καθαρά “AI visual”, χωρίς κείμενα.)
                  </div>
                  <div class="orbPopupGrid">
                    <div class="orbMini">
                      <div class="orbMiniLbl">State</div>
                      <div class="orbMiniVal">LISTENING</div>
                    </div>
                    <div class="orbMini">
                      <div class="orbMiniLbl">Axis</div>
                      <div class="orbMiniVal">Dark → Bright</div>
                    </div>
                  </div>
                </div>
              </details>
            </div>

            <div id="mirrorPill" class="mirrorPill">
              <span class="miniDot" aria-hidden="true"></span>
              <span id="mirrorPillText">IDLE</span>
            </div>
          </div>

          <div id="mirrorState" class="mirrorState">IDLE</div>

          <div class="meters" aria-label="Mirror meters">
            <div class="meter">
              <div class="meterLbl">Energy</div>
              <div class="meterVal">
                <div class="bar"><i id="mEnergy"></i></div>
                <div id="mEnergyNum" class="meterNum">—</div>
              </div>
            </div>

            <div class="meter">
              <div class="meterLbl">Mood</div>
              <div class="meterVal">
                <div class="bar"><i id="mMood"></i></div>
                <div id="mMoodNum" class="meterNum">—</div>
              </div>
            </div>

            <div class="meter">
              <div class="meterLbl">Replay</div>
              <div class="meterVal">
                <div class="bar"><i id="mReplay"></i></div>
                <div id="mReplayNum" class="meterNum">—</div>
              </div>
            </div>
          </div>

          <div class="mood" aria-label="Mood axis">
            <div class="moodTop">
              <div class="moodLbl">Axis</div>
              <div class="moodAxis">Dark — Bright</div>
            </div>
            <div class="moodBar">
              <div id="mDot" class="moodDot" style="left:50%"></div>
            </div>

            <div class="stack">
              <div class="stackLbl">Session covers</div>
              <div id="mCovers" class="covers" aria-label="Covers stack"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="controls">
          <div class="seg" aria-label="Top type">
            <button data-top-type="tracks" aria-selected="true">Track</button>
            <button data-top-type="artists" aria-selected="false">Artist</button>
            <button data-top-type="albums" aria-selected="false">Album</button>
          </div>

          <div class="seg" aria-label="Top period">
            <button data-top-period="today" aria-selected="true">Today</button>
            <button data-top-period="week" aria-selected="false">Week</button>
            <button data-top-period="year" aria-selected="false">Year</button>
          </div>
        </div>

        <div class="list" id="topList" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="list" id="recentList" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
