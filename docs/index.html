<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#07080a;
      --glass: rgba(18, 22, 30, .62);
      --glass2: rgba(14, 16, 22, .55);
      --stroke: rgba(255,255,255,.08);
      --stroke2: rgba(255,255,255,.06);
      --text:#f2f4f8;
      --muted: rgba(242,244,248,.72);
      --muted2: rgba(242,244,248,.46);
      --accent:#32d27b;
      --shadow: 0 24px 70px rgba(0,0,0,.58);
      --r: 26px;
      --r2: 18px;
      --w: 720px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 700px at 50% -10%, rgba(66,120,255,.18), transparent 55%),
                  radial-gradient(900px 520px at 10% 10%, rgba(120,70,255,.10), transparent 60%),
                  radial-gradient(900px 520px at 90% 20%, rgba(0,255,170,.06), transparent 60%),
                  linear-gradient(180deg, #050607 0%, #07080a 45%, #050607 100%);
      overflow-x:hidden;
    }

    .wrap{
      max-width: var(--w);
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:14px;
      margin: 10px 0 14px;
    }

    .logo{
      width:52px; height:52px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      border: 1px solid var(--stroke);
      box-shadow: 0 18px 55px rgba(0,0,0,.42);
      display:grid;
      place-items:center;
      font-weight: 800;
      letter-spacing: .02em;
      opacity:.96;
      flex: 0 0 auto;
      user-select:none;
    }

    .brand{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .brand h1{
      margin:0;
      font-size: 22px;
      line-height: 1.08;
      letter-spacing: .01em;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .01em;
    }

    .dot{
      width:10px; height:10px;
      border-radius: 99px;
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .dot.on{
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(50,210,123,.12);
    }

    /* Tabs */
    .tabsShell{
      margin-top: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke2);
      border-radius: 999px;
      padding: 6px;
      display:flex;
      gap:6px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tabBtn{
      flex:1;
      border:0;
      color: var(--muted);
      background: transparent;
      border-radius: 999px;
      padding: 12px 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor:pointer;
      transition: transform .12s ease, background .18s ease, color .18s ease;
    }
    .tabBtn[aria-selected="true"]{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    /* Panels */
    .panel{ margin-top: 14px; }
    .hidden{ display:none; }

    /* Sticky headers inside panels */
    .stickyHeader{
      position: sticky;
      top: 10px;
      z-index: 15;
      padding: 10px 0;
      background: linear-gradient(180deg, rgba(7,8,10,.92) 0%, rgba(7,8,10,.60) 60%, rgba(7,8,10,0) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card{
      background: var(--glass);
      border: 1px solid var(--stroke2);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow:hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 10px;
    }

    .titleBlock h2{
      margin:0;
      font-size: 28px;
      letter-spacing: .01em;
      line-height: 1.06;
    }
    .subline{
      margin-top: 6px;
      color: var(--muted2);
      font-size: 14px;
      letter-spacing:.01em;
    }

    .pill{
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .02em;
      user-select:none;
      flex:0 0 auto;
    }
    .pill.live{
      color: #0c1c12;
      background: rgba(50,210,123,.92);
      border-color: rgba(50,210,123,.55);
      box-shadow: 0 14px 30px rgba(50,210,123,.20);
    }

    /* Now playing layout */
    .nowGrid{
      display:grid;
      grid-template-columns: 120px 1fr;
      gap:16px;
      align-items:center;
    }

    .coverBig{
      width:120px; height:120px;
      border-radius: 22px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      position:relative;
    }
    .coverBig img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }
    .coverBig .fallback{
      position:absolute; inset:0;
      display:grid;
      place-items:center;
      color: rgba(255,255,255,.40);
      font-size: 26px;
      letter-spacing:.06em;
      user-select:none;
    }

    .nowText{ min-width:0; }
    .nowTrack{
      font-size: 34px;
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: .01em;
      margin:0;
    }
    .nowMeta{
      margin-top: 8px;
      display:flex;
      flex-direction:column;
      gap:4px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 650;
    }
    .nowState{
      margin-top: 10px;
      color: var(--muted2);
      font-size: 14px;
    }

    /* Controls (Top panel) */
    .controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 12px;
    }
    .seg{
      display:flex;
      gap:8px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke2);
      border-radius: 999px;
      padding: 6px;
      width:100%;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .seg button{
      flex:1;
      border:0;
      background: transparent;
      color: var(--muted2);
      padding: 10px 10px;
      border-radius: 999px;
      font-weight: 850;
      letter-spacing: .01em;
      cursor:pointer;
      transition: background .18s ease, color .18s ease, transform .12s ease;
    }
    .seg button[aria-selected="true"]{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    /* List rows */
    .list{
      margin-top: 14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .row{
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 22px;
      padding: 14px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease;
      user-select:none;
    }
    .row.is-press{
      transform: scale(.988);
      box-shadow: 0 18px 55px rgba(0,0,0,.42), 0 0 0 6px rgba(50,210,123,.10);
      border-color: rgba(50,210,123,.28);
    }

    .cover{
      width:64px; height:64px;
      border-radius: 18px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      position:relative;
      flex: 0 0 auto;
    }
    .cover img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }
    .cover .coverFallback{
      position:absolute; inset:0;
      display:grid;
      place-items:center;
      color: rgba(255,255,255,.35);
      font-size: 18px;
      user-select:none;
    }

    .mid{
      min-width:0;
      flex:1;
      display:flex;
      align-items:baseline;
      gap:10px;
    }

    /* Index column (never in marquee) */
    .idx{
      flex:0 0 auto;
      width: 32px;
      text-align:right;
      font-weight: 900;
      color: rgba(242,244,248,.42);
      letter-spacing: .08em;
      font-variant-numeric: tabular-nums;
    }

    .textCol{
      min-width:0;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .title{
      font-weight: 900;
      font-size: 20px;
      line-height: 1.05;
      letter-spacing: .01em;
      color: var(--text);
      min-width:0;
    }
    .sub{
      color: var(--muted2);
      font-weight: 750;
      font-size: 15px;
      letter-spacing: .01em;
      min-width:0;
    }

    /* Marquee: only on the text span, NOT on the idx */
    .marquee{
      position:relative;
      overflow:hidden;
      padding-left: 4px; /* "τσαφ" δεξιά, ώστε να μη φαγώνεται το πρώτο γράμμα */
      -webkit-mask-image: linear-gradient(to right,
        transparent 0px,
        rgba(0,0,0,1) 14px,
        rgba(0,0,0,1) calc(100% - 22px),
        transparent 100%);
      mask-image: linear-gradient(to right,
        transparent 0px,
        rgba(0,0,0,1) 14px,
        rgba(0,0,0,1) calc(100% - 22px),
        transparent 100%);
    }
    .marquee .inner{
      display:inline-flex;
      gap: 18px;
      white-space: nowrap;
      will-change: transform;
    }
    .marquee[data-animate="false"] .inner{
      transform:none !important;
      animation:none !important;
    }
    @keyframes scrollX{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(calc(-1 * var(--dx))); }
    }

    .right{
      flex:0 0 auto;
      min-width: 46px;
      text-align:right;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      color: rgba(242,244,248,.50);
    }
    .right.accent{
      color: rgba(50,210,123,.92);
    }

    .empty{
      margin-top: 14px;
      padding: 18px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      box-shadow: 0 16px 45px rgba(0,0,0,.32);
    }

    @media (max-width: 430px){
      .nowTrack{ font-size: 30px; }
      .coverBig{ width:110px; height:110px; border-radius: 20px; }
      .nowGrid{ grid-template-columns: 110px 1fr; }
      .idx{ width: 28px; }
      .title{ font-size: 19px; }
      .cover{ width:62px; height:62px; border-radius: 17px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="logo">LM</div>
      <div class="brand">
        <h1>Listening Mirror</h1>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusLine">Offline</span></div>
      </div>
    </div>

    <div class="tabsShell" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true">Now Playing</button>
      <button class="tabBtn" data-tab="top" aria-selected="false">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false">Recent</button>
    </div>

    <!-- NOW -->
    <section class="panel" data-panel="now">
      <div class="card">
        <div class="cardHeader">
          <div class="titleBlock">
            <h2>Now Playing</h2>
            <div class="subline">Updated: <span id="nowUpdated">--</span></div>
          </div>
          <div id="nowBadge" class="pill">OFF</div>
        </div>

        <div class="nowGrid">
          <div class="coverBig">
            <img id="nowImg" alt="" style="display:none" />
            <div id="nowFallback" class="fallback">♪</div>
          </div>

          <div class="nowText">
            <h3 id="nowTrack" class="nowTrack">—</h3>
            <div class="nowMeta">
              <div id="nowArtist">—</div>
              <div id="nowAlbum" style="color:rgba(242,244,248,.50); font-weight:750;">—</div>
            </div>
            <div id="nowMsg" class="nowState"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- TOP -->
    <section class="panel hidden" data-panel="top">
      <div class="stickyHeader">
        <div class="card" style="padding-bottom:14px">
          <div class="cardHeader" style="margin-bottom:6px">
            <div class="titleBlock">
              <h2 style="margin-bottom:0">Top</h2>
              <div id="topMeta" class="subline">—</div>
            </div>
            <div class="pill" id="topBadge">10</div>
          </div>

          <div class="controls">
            <div class="seg" aria-label="Top type">
              <button data-top-type="tracks" aria-selected="true">Tracks</button>
              <button data-top-type="artists" aria-selected="false">Artists</button>
              <button data-top-type="albums" aria-selected="false">Albums</button>
            </div>

            <div class="seg" aria-label="Top period">
              <button data-top-period="today" aria-selected="true">Today</button>
              <button data-top-period="week" aria-selected="false">Week</button>
              <button data-top-period="year" aria-selected="false">Year</button>
            </div>
          </div>
        </div>
      </div>

      <div id="topList" class="list"></div>
      <div id="topEmpty" class="empty" style="display:none"></div>
    </section>

    <!-- RECENT -->
    <section class="panel hidden" data-panel="recent">
      <div class="stickyHeader">
        <div class="card" style="padding-bottom:14px">
          <div class="cardHeader" style="margin-bottom:6px">
            <div class="titleBlock">
              <h2 style="margin-bottom:0">Recent</h2>
              <div id="recentMeta" class="subline">—</div>
            </div>
            <div class="pill">last 10</div>
          </div>
        </div>
      </div>

      <div id="recentList" class="list"></div>
      <div id="recentEmpty" class="empty" style="display:none"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
