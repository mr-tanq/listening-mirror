<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Mirror</title>

<style>
:root{color-scheme:dark}
body{
background:#0b0b0b;
color:#eaeaea;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
margin:0;
padding:20px;
}
h1{margin:0 0 6px;font-size:34px}
.small{opacity:.7;font-size:13px;margin-bottom:14px}
.card{
background:#141414;
border-radius:16px;
padding:16px;
margin-bottom:16px;
border:1px solid #2a2a2a;
}
h2{margin:0 0 10px;font-size:20px}
.muted{opacity:.72;font-size:13px}
.track{margin:6px 0;line-height:1.25}
.row{display:flex;gap:14px;align-items:center}
.cover{
width:110px;height:110px;border-radius:12px;
border:1px solid #2a2a2a;object-fit:cover;background:#0d0d0d;
}
.title{font-size:16px;font-weight:650;margin:0 0 6px}
.sub{margin:0;opacity:.75;font-size:13px}
.pill{display:inline-block;padding:6px 10px;border:1px solid #2a2a2a;border-radius:999px;font-size:12px;margin-top:10px}
.error{color:#ffb4b4;font-size:12px}
</style>
</head>

<body>

<h1>Listening Mirror</h1>
<div class="small">connected to last.fm user: <b>errz</b></div>

<div class="card"><h2>Status</h2><div id="status" class="muted">loading…</div></div>
<div class="card"><h2>Now Playing</h2><div id="now"></div></div>
<div class="card"><h2>Today's Reflection</h2><div id="reflection"></div></div>
<div class="card"><h2>Today</h2><div id="today"></div></div>
<div class="card"><h2>Top artists (7 days)</h2><div id="artists"></div></div>

<script>

const API="https://i.errtanq9.workers.dev";

function set(id,html){document.getElementById(id).innerHTML=html}

async function load(){

try{

document.getElementById("status").innerText="syncing…"

const now=await fetch(API+"/now").then(r=>r.json())
const recent=await fetch(API+"/recent").then(r=>r.json())
const top=await fetch(API+"/top").then(r=>r.json())

/* NOW PLAYING */

if(now && now.artist){
set("now",`
<div class="row">
<img class="cover" src="${now.image||""}">
<div>
<div class="title">${now.artist} — ${now.name}</div>
<div class="sub">${now.album||""}</div>
<span class="pill">${now.nowPlaying?"LIVE now playing":"last played"}</span>
</div>
</div>`)
}else set("now","<div class='muted'>Nothing playing right now</div>")

/* TODAY */

const today=(recent.recent||[])
set("today",today.map(t=>`<div class="track">${t.artist} — ${t.name}</div>`).join("")||"<div class='muted'>No scrobbles yet</div>")

/* REFLECTION */

const artists=[...new Set(today.map(t=>t.artist))]
set("reflection",`You listened to <b>${artists.length}</b> artists today across <b>${today.length}</b> plays.`)

/* TOP */

const topArtists=top.artists||[]
set("artists",topArtists.map(a=>`<div class="track">${a.name} (${a.playcount})</div>`).join(""))

document.getElementById("status").innerText="OK"

}catch(e){
document.getElementById("status").innerText="error"
console.log(e)
}

}

load()
setInterval(load,15000)

</script>
</body>
</html>
