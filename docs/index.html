<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --bg2:#090a0c;
      --card: rgba(255,255,255,.055);
      --card2: rgba(255,255,255,.035);
      --text:#ececee;
      --muted:#a7abb4;
      --muted2:#7d828d;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r: 22px;

      --live:#ff3b3b;
      --liveBg: rgba(255,59,59,.10);
      --liveBd: rgba(255,59,59,.30);

      --safeL: max(14px, env(safe-area-inset-left));
      --safeR: max(14px, env(safe-area-inset-right));
      --safeT: max(14px, env(safe-area-inset-top));
      --safeB: max(14px, env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    html{ overscroll-behavior-y:none; }

    body{
      margin:0;
      overflow-x:hidden;
      overscroll-behavior-y:none;
      background:
        radial-gradient(1200px 700px at 25% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(255,255,255,.04), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .app{
      position: relative;
      z-index: 1;
      min-height:100%;
      padding: calc(var(--safeT) + 14px) var(--safeR) calc(var(--safeB) + 18px) var(--safeL);
      max-width: 920px;
      margin: 0 auto;
    }

    header{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 2px;
    }

    .glyph{
      width: 16px;
      height: 16px;
      border-radius: 999px;
      position:relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,.05) 55%, rgba(255,255,255,.03) 70%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      flex: 0 0 auto;
    }
    .glyph:before{
      content:"";
      position:absolute;
      inset:3px;
      border-radius: 999px;
      outline: 1px solid rgba(255,255,255,.10);
      background: radial-gradient(circle at 65% 35%, rgba(255,255,255,.10), transparent 60%);
      opacity:.9;
    }

    .wordmark{
      display:flex;
      flex-direction:column;
      line-height: 1.15;
    }
    .wordmark .title{
      font-size: 18px;
      font-weight: 720;
      letter-spacing: .35px;
      margin:0;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.70));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .wordmark .sub{
      margin-top: 6px;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted2);
      font-size: 12px;
      letter-spacing: .2px;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.14);
      outline: 1px solid rgba(255,255,255,.10);
    }
    .dot.on{
      background: rgba(49,208,124,.75);
      outline-color: rgba(49,208,124,.35);
      box-shadow: 0 0 0 3px rgba(49,208,124,.10);
    }

    /* Tabs:
       DOM order stays Now/Top/Recent (for app.js)
       Visual order is Now/Recent/Top */
    .tabs{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      width: 100%;
      margin: 12px 0 16px 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar{ display:none; }

    .tabBtn{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.72);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .2px;
      cursor:pointer;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .tabBtn[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .tabBtn[data-tab="now"]{ order: 1; }
    .tabBtn[data-tab="recent"]{ order: 2; }
    .tabBtn[data-tab="top"]{ order: 3; }

    .panel{ display:block; }
    .hidden{ display:none; }

    .card{
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--card), var(--card2));
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
<!-- PART 2/4 -->
    /* NOW ambient artwork */
    .nowAmbient{
      position:absolute;
      inset:-1px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .22s ease;
    }
    .nowAmbient.on{ opacity: 1; }
    .nowAmbient:before{
      content:"";
      position:absolute;
      inset:0;
      background-image: var(--ambient-url, none);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02);
      opacity: .95;
      filter: saturate(1.02) contrast(1.02);
    }
    .nowAmbient:after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 520px at 18% 8%, rgba(255,255,255,.10), transparent 55%),
        radial-gradient(700px 420px at 85% 10%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, rgba(8,9,11,.50), rgba(8,9,11,.92));
    }

    .nowWrap{ position:relative; padding: 18px; }
    .nowTop{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      margin-bottom: 14px;
      position:relative;
      z-index:2;
      min-height: 24px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      outline: 1px solid rgba(255,255,255,.085);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing:.25px;
      white-space:nowrap;
    }
    .chip .miniDot{ width:6px;height:6px;border-radius:999px; background: rgba(255,255,255,.18); }
    .chip.live{
      color: rgba(255,255,255,.95);
      outline-color: var(--liveBd);
      background: var(--liveBg);
    }
    .chip.live .miniDot{
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(255,59,59,.12);
    }

    .nowMain{
      display:grid;
      grid-template-columns: 1fr;
      position:relative;
      z-index:2;
    }
    .coverWrap{ display:none !important; }

    .nowText{ min-width:0; padding-left: 2px; }
    .line1{ font-size: 15.5px; font-weight: 720; letter-spacing: .15px; }
    .line2{ margin-top: 6px; font-size: 13.5px; color: rgba(255,255,255,.72); }
    .line3{ margin-top: 6px; font-size: 12px; color: var(--muted2); }

    .marq{ display:inline-block; white-space:nowrap; will-change:transform; }
    .marqWrap{
      position:relative;
      overflow:hidden;
      padding-left: 3px;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
    }
    .marqOn .marq{ animation: marqMove var(--marqDur, 10s) linear infinite; }
    @keyframes marqMove{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(calc(-1 * var(--marqShift, 60px))); }
    }

    .controls{
      padding: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .seg{
      display:flex;
      gap:8px;
      padding: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      width: fit-content;
    }
    .seg button{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.74);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor:pointer;
      letter-spacing:.2px;
    }
    .seg button[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .list{ padding: 10px; }

    .row{
      display:grid;
      grid-template-columns: 52px minmax(0,1fr) max-content;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 16px;
      align-items:center;
      user-select:none;
    }
    .row:hover{ background: rgba(255,255,255,.035); }
    .row:active{ background: rgba(255,255,255,.045); }

    .thumb{
      width: 44px; height: 44px;
      border-radius: 14px;
      overflow:hidden;
      position:relative;
      outline: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.40);
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumbFallback{
      position:absolute; inset:0; display:grid; place-items:center;
      color: rgba(255,255,255,.35); font-size: 18px;
    }

    .mid{ min-width:0; padding-left: 3px; }
    .title{
      font-size: 13.5px;
      font-weight: 650;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right{
      justify-self:end;
      text-align:right;
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(255,255,255,.80);
      padding-left: 8px;
      white-space:nowrap;
    }
    .right.count{ color: rgba(255,214,102,.92); }

    /* Mirror */
    .mirrorCard{ margin-top: 16px; overflow: visible; }
    .mirrorWrap{ padding: 16px 18px 18px 18px; position:relative; }

    .mirrorTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 12px;
    }
    .mirrorTitle{
      font-size: 11.5px;
      letter-spacing: .34px;
      color: rgba(255,255,255,.62);
      text-transform: uppercase;
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

    .orbDetails{ position:relative; display:inline-block; }
    .orbDetails summary{
      list-style:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      outline:none;
    }
    .orbDetails summary::-webkit-details-marker{ display:none; }

    .orb{
      width: 18px;
      height: 18px;
      border-radius: 999px;
      position:relative;
      flex: 0 0 auto;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.28), rgba(255,255,255,.09) 55%, rgba(255,255,255,.05) 75%),
        radial-gradient(circle at 70% 65%, rgba(255,255,255,.10), transparent 60%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
    }

    .orbPopup{
      position:absolute;
      top: calc(100% + 10px);
      left: 0;
      width: min(320px, calc(100vw - 40px));
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(22,24,28,.92), rgba(14,16,19,.92));
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 22px 70px rgba(0,0,0,.62);
      padding: 12px;
      z-index: 50;
    }
    .orbPopupTitle{
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .25px;
      color: rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
    }
    .orbPopupHint{ font-size: 11px; color: rgba(255,255,255,.58); line-height: 1.35; }

    .mirrorPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing: .2px;
      white-space:nowrap;
    }
    .mirrorPill .miniDot{ width:6px;height:6px;border-radius:999px; background: rgba(255,255,255,.20); }

    .mirrorState{
      font-size: 18px;
      font-weight: 760;
      letter-spacing: .12px;
      margin: 6px 0 2px 0;
      color: rgba(255,255,255,.94);
    }

    /* Art card (THE doodles live here) */
    .artCard{ margin-top: 16px; }
    .artWrap{
      padding: 14px 18px 18px 18px;
    }
    .artHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }
    .artTitle{
      font-size: 11.5px;
      letter-spacing: .34px;
      color: rgba(255,255,255,.62);
      text-transform: uppercase;
    }
    .artHint{
      font-size: 12px;
      color: rgba(255,255,255,.55);
      letter-spacing: .15px;
    }
    #artCanvas{
      width: 100%;
      height: 240px;
      display:block;
      border-radius: 18px;
      outline: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.12);
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }

    /* hidden sensor stays hidden (axis UI removed) */
    .mood{ display:none !important; }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="glyph" aria-hidden="true"></div>
        <div class="wordmark">
          <div class="title">Listening Mirror</div>
          <div class="sub">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusLine">Offline</span>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true" role="tab">Now</button>
      <button class="tabBtn" data-tab="top" aria-selected="false" role="tab">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false" role="tab">Recent</button>
    </div>

    <section class="panel" data-panel="now">
      <div class="card">
        <div id="nowAmbient" class="nowAmbient"></div>

        <div class="nowWrap">
          <div class="nowTop">
            <div id="nowBadge" class="chip">
              <span class="miniDot" aria-hidden="true"></span>
              <span id="nowBadgeText">OFF</span>
            </div>
          </div>

          <div class="nowMain">
            <div class="coverWrap" id="nowCoverWrap">
              <img id="nowImg" class="coverImg" alt="" />
              <div id="nowFallback" class="coverFallback">♪</div>
            </div>

            <div class="nowText">
              <div class="line1 marqWrap" id="nowTrackWrap">
                <span class="marq" id="nowTrack">—</span>
              </div>
              <div class="line2 marqWrap" id="nowArtistWrap">
                <span class="marq" id="nowArtist">—</span>
              </div>
              <div class="line3 marqWrap" id="nowAlbumWrap">
                <span class="marq" id="nowAlbum">—</span>
              </div>
              <div class="sub" id="nowMsg" style="margin-top:12px;">—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mirrorCard" id="mirrorCard">
        <div class="mirrorWrap">
          <div class="mirrorTop">
            <div class="mirrorTitle">
              <details class="orbDetails" id="orbDetails">
                <summary aria-label="Open Mirror popup">
                  <span id="mirrorOrb" class="orb" aria-hidden="true"></span>
                  Mirror
                </summary>
                <div class="orbPopup" role="dialog" aria-label="Mirror popup">
                  <div class="orbPopupTitle">
                    <span>Mirror</span>
                    <span highlight style="font-size:11px;color:rgba(255,255,255,.55)">tap orb again</span>
                  </div>
                  <div class="orbPopupHint">Visual layer is active.</div>
                </div>
              </details>
            </div>

            <div id="mirrorPill" class="mirrorPill">
              <span class="miniDot" aria-hidden="true"></span>
              <span id="mirrorPillText">IDLE</span>
            </div>
          </div>

          <div id="mirrorState" class="mirrorState">IDLE</div>

          <!-- hidden sensor (still in DOM if app.js uses it) -->
          <div class="mood">
            <div class="moodBar">
              <div id="mDot" class="moodDot" style="left:50%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ✅ DOODLES LIVE HERE (below Mirror) -->
      <div class="card artCard" id="artCard">
        <div class="artWrap">
          <div class="artHead">
            <div class="artTitle">Art</div>
            <div class="artHint" id="artHint">session sketch</div>
          </div>
          <canvas id="artCanvas" aria-label="Generated art canvas"></canvas>
        </div>
      </div>
    </section>

    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="controls">
          <div class="seg" aria-label="Top type">
            <button data-top-type="tracks" aria-selected="true">Track</button>
            <button data-top-type="artists" aria-selected="false">Artist</button>
            <button data-top-type="albums" aria-selected="false">Album</button>
          </div>

          <div class="seg" aria-label="Top period">
            <button data-top-period="today" aria-selected="true">Today</button>
            <button data-top-period="week" aria-selected="false">Week</button>
            <button data-top-period="year" aria-selected="false">Year</button>
          </div>
        </div>

        <div class="list" id="topList" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="list" id="recentList" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
<!-- PART 4/4 -->
  <script>
    // Doodles: premium ink / poster-ish, ALWAYS visible.
    (function(){
      const c = document.getElementById("artCanvas");
      if(!c) return;
      const ctx = c.getContext("2d");

      function fit(){
        const rect = c.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        c.width  = Math.floor(rect.width * dpr);
        c.height = Math.floor(rect.height * dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        draw();
      }
      window.addEventListener("resize", fit, {passive:true});

      function seeded(n){
        // deterministic-ish (per load) without external deps
        let s = (Date.now() % 100000) + n*9991;
        return () => {
          s = (s * 1664525 + 1013904223) % 4294967296;
          return s / 4294967296;
        };
      }

      function draw(){
        const W = c.getBoundingClientRect().width;
        const H = c.getBoundingClientRect().height;
        ctx.clearRect(0,0,W,H);

        // deep glass base
        ctx.fillStyle = "rgba(0,0,0,.18)";
        ctx.fillRect(0,0,W,H);

        // subtle vignette
        const vg = ctx.createRadialGradient(W*0.55, H*0.35, 10, W*0.55, H*0.35, Math.max(W,H));
        vg.addColorStop(0, "rgba(255,255,255,.06)");
        vg.addColorStop(1, "rgba(0,0,0,.38)");
        ctx.fillStyle = vg;
        ctx.fillRect(0,0,W,H);

        // “premium ink” motif: a few geometric glyphs + stipple
        const rnd = seeded(3);

        // glyph strokes (thin, intentional — not random lines everywhere)
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255,255,255,.12)";
        ctx.beginPath();
        const cx = W*0.72, cy = H*0.62;
        const r = Math.min(W,H)*0.18;

        // 3 hexes cluster
        for(let i=0;i<3;i++){
          const ox = (i-1)*r*0.95;
          const oy = (i===1? -r*0.55 : 0);
          hex(ctx, cx+ox, cy+oy, r*0.55);
 adds(ctx, cx+ox, cy+oy, r*0.55);
        }
        ctx.stroke();

        // one “ink wave” curve (single elegant stroke)
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255,.10)";
        const baseY = H*0.78;
        ctx.moveTo(W*0.12, baseY);
        ctx.bezierCurveTo(W*0.28, baseY-30, W*0.52, baseY+20, W*0.78, baseY-18);
        ctx.bezierCurveTo(W*0.88, baseY-35, W*0.95, baseY-10, W*0.98, baseY-22);
        ctx.stroke();

        // stipple (ink dust)
        const dots = 240;
        for(let i=0;i<dots;i++){
          const x = rnd()*W;
          const y = rnd()*H;
          const a = 0.02 + rnd()*0.04;
          const rr = 0.6 + rnd()*1.2;
          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${a})`;
          ctx.arc(x,y,rr,0,Math.PI*2);
          ctx.fill();
        }

        // 1 accent “seal” circle (very subtle)
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255,.10)";
        ctx.arc(W*0.18, H*0.28, Math.min(W,H)*0.12, 0, Math.PI*2);
        ctx.stroke();
      }

      function hex(ctx, x,y,r){
        ctx.moveTo(x + r, y);
        for(let i=1;i<=6;i++){
          const a = i*Math.PI/3;
          ctx.lineTo(x + r*Math.cos(a), y + r*Math.sin(a));
        }
      }
      function adds(ctx, x,y,r){
        // small inner line to make it feel “designed”
        ctx.moveTo(x - r*0.45, y + r*0.10);
        ctx.lineTo(x + r*0.42, y - r*0.08);
      }

      fit();
    })();
  </script>
</body>
