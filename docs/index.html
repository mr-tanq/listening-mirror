<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>Listening Mirror</title>

  <style>
    :root{
      --bg:#0b0c0e;
      --bg2:#090a0c;

      --card: rgba(255,255,255,.055);
      --card2: rgba(255,255,255,.035);

      --text:#ececee;
      --muted:#a7abb4;
      --muted2:#7d828d;

      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r: 22px;

      --live:#ff3b3b;
      --liveBg: rgba(255,59,59,.10);
      --liveBd: rgba(255,59,59,.30);

      --safeL: max(14px, env(safe-area-inset-left));
      --safeR: max(14px, env(safe-area-inset-right));
      --safeT: max(14px, env(safe-area-inset-top));
      --safeB: max(14px, env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    html{ overscroll-behavior-y:none; }
    body{
      margin:0;
      overflow-x:hidden;
      overscroll-behavior-y:none;
      background:
        radial-gradient(1200px 700px at 25% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(255,255,255,.04), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .app{
      min-height:100%;
      padding: calc(var(--safeT) + 14px) var(--safeR) calc(var(--safeB) + 18px) var(--safeL);
      max-width: 920px;
      margin: 0 auto;
    }

    header{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding-left: 2px;
    }

    .glyph{
      width: 16px;
      height: 16px;
      border-radius: 999px;
      position:relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,.05) 55%, rgba(255,255,255,.03) 70%);
      outline: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      flex: 0 0 auto;
    }
    .glyph:before{
      content:"";
      position:absolute;
      inset:3px;
      border-radius: 999px;
      outline: 1px solid rgba(255,255,255,.10);
      background: radial-gradient(circle at 65% 35%, rgba(255,255,255,.10), transparent 60%);
      opacity:.9;
    }

    .wordmark{
      display:flex;
      flex-direction:column;
      line-height: 1.15;
    }
    .wordmark .title{
      font-size: 18px;
      font-weight: 720;
      letter-spacing: .35px;
      margin:0;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.70));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .wordmark .sub{
      margin-top: 6px;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--muted2);
      font-size: 12px;
      letter-spacing: .2px;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.14);
      outline: 1px solid rgba(255,255,255,.10);
    }
    .dot.on{
      background: rgba(49,208,124,.75);
      outline-color: rgba(49,208,124,.35);
      box-shadow: 0 0 0 3px rgba(49,208,124,.10);
    }

    /* ---------- TABS (professional, not scattered) ---------- */
    .tabs{
      width: 100%;
      max-width: 560px;
      margin: 12px auto 18px auto;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 45px rgba(0,0,0,.35);
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tabBtn{
      width: 100%;
      border:0;
      background: transparent;
      color: rgba(255,255,255,.72);
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .2px;
      cursor:pointer;
      text-align:center;
    }
    .tabBtn[aria-selected="true"]{
      background: rgba(255,255,255,.10);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .panel{ display:block; }
    .hidden{ display:none; }

    .card{
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--card), var(--card2));
      outline: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    /* ---------- NOW: full artwork like Spotify widget, text bottom-left ---------- */
    .nowAmbient{
      position:absolute;
      inset:-1px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease;
    }
    .nowAmbient.on{ opacity: 1; }

    /* Sharp artwork fills the card */
    .nowAmbient:before{
      content:"";
      position:absolute;
      inset:0;
      background-image: var(--ambient-url, none);
      background-size: cover;
      background-position: center;
      background-repeat:no-repeat;
      transform: scale(1.02);
      filter: saturate(1.05) contrast(1.02);
      opacity: .98;
    }

    /* Premium overlays (ensure readability) + inner vignette */
    .nowAmbient:after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 600px at 30% 10%, rgba(255,255,255,.10), transparent 55%),
        radial-gradient(900px 520px at 85% 18%, rgba(255,255,255,.08), transparent 62%),
        linear-gradient(180deg, rgba(10,11,13,.22), rgba(10,11,13,.72)),
        radial-gradient(900px 520px at 50% 40%, rgba(0,0,0,.10), rgba(0,0,0,.55));
      mix-blend-mode: normal;
    }

    .nowWrap{
      position:relative;
      min-height: 168px;
      padding: 16px;
    }

    /* Inner shadow like real widget */
    .nowWrap:before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        inset 0 -40px 90px rgba(0,0,0,.42);
      border-radius: var(--r);
      z-index:2;
    }

    /* LIVE chip top-right */
    .chip{
      position:absolute;
      top: 14px;
      right: 14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      letter-spacing:.25px;
      white-space:nowrap;
      z-index:4;
      backdrop-filter: blur(10px);
    }
    .chip .miniDot{ width:6px;height:6px;border-radius:999px; background: rgba(255,255,255,.18); }
    .chip.live{
      color: rgba(255,255,255,.95);
      outline-color: var(--liveBd);
      background: var(--liveBg);
    }
    .chip.live .miniDot{
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(255,59,59,.12);
    }

    /* Bottom-left text block */
    .nowText{
      position:absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index:4;
      min-width:0;
    }

    .line1{
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .10px;
      text-shadow: 0 10px 28px rgba(0,0,0,.55);
    }
    .line2{
      margin-top: 6px;
      font-size: 13.5px;
      color: rgba(255,255,255,.84);
      text-shadow: 0 10px 28px rgba(0,0,0,.55);
    }
    .line3{
      margin-top: 6px;
      font-size: 12.5px;
      color: rgba(255,255,255,.70);
      text-shadow: 0 10px 28px rgba(0,0,0,.55);
    }

    /* Marquee: fade only right end (never cut first letter) */
    .marq{ display:inline-block; white-space:nowrap; will-change:transform; }
    .marqWrap{
      position:relative;
      overflow:hidden;
      padding-left: 3px;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 86%, transparent 100%);
    }
    .marqOn .marq{ animation: marqMove var(--marqDur, 10s) linear infinite; }
    @keyframes marqMove{
      0%{ transform: translateX(0); }
      100%{ transform: translateX(calc(-1 * var(--marqShift, 60px))); }
    }

    /* Hide the old message line in NOW (we keep the id for app.js compatibility) */
    #nowMsg{ display:none !important; }

    /* ---------- TOP / RECENT ---------- */
    .controls{
      padding: 14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .seg{
      display:flex;
      gap:8px;
      padding: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      outline: 1px solid rgba(255,255,255,.08);
      width: fit-content;
    }
    .seg button{
      border:0;
      background: transparent;
      color: rgba(255,255,255,.74);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor:pointer;
      letter-spacing:.2px;
    }
    .seg button[aria-selected="true"]{
      background: rgba(255,255,255,.085);
      outline: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
    }

    .list{ padding: 10px; }

    .row{
      display:grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      padding: 12px 12px 12px 16px;
      border-radius: 16px;
      align-items:center;
      user-select:none;
    }
    .row:hover{ background: rgba(255,255,255,.035); }
    .row:active{ background: rgba(255,255,255,.045); }

    .thumb{
      width: 44px; height: 44px;
      border-radius: 14px;
      overflow:hidden;
      position:relative;
      outline: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.40);
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumbFallback{
      position:absolute; inset:0; display:grid; place-items:center;
      color: rgba(255,255,255,.35); font-size: 18px;
    }

    .mid{ min-width:0; padding-left: 3px; }
    .title{
      font-size: 13.5px;
      font-weight: 650;
      color: rgba(255,255,255,.92);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right{
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(255,255,255,.80);
      padding-left: 8px;
      white-space:nowrap;
    }
    .right.count{
      color: rgba(255,214,102,.92);
    }

    @media (max-width: 520px){
      .tabs{ max-width: 100%; }
      .nowWrap{ min-height: 156px; padding: 14px; }
      .nowText{ left: 14px; right: 14px; bottom: 12px; }
      .chip{ top: 12px; right: 12px; }
      .line1{ font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="glyph" aria-hidden="true"></div>
        <div class="wordmark">
          <div class="title">Listening Mirror</div>
          <div class="sub">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusLine">Offline</span>
          </div>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Main tabs">
      <button class="tabBtn" data-tab="now" aria-selected="true" role="tab">Now</button>
      <button class="tabBtn" data-tab="top" aria-selected="false" role="tab">Top</button>
      <button class="tabBtn" data-tab="recent" aria-selected="false" role="tab">Recent</button>
    </div>

    <section class="panel" data-panel="now">
      <div class="card">
        <div id="nowAmbient" class="nowAmbient"></div>

        <div class="nowWrap">
          <!-- LIVE top-right -->
          <div id="nowBadge" class="chip">
            <span class="miniDot" aria-hidden="true"></span>
            <span id="nowBadgeText">OFF</span>
          </div>

          <!-- Bottom-left text (Spotify widget style) -->
          <div class="nowText">
            <div class="line1 marqWrap" id="nowTrackWrap">
              <span class="marq" id="nowTrack">—</span>
            </div>
            <div class="line2 marqWrap" id="nowArtistWrap">
              <span class="marq" id="nowArtist">—</span>
            </div>
            <div class="line3 marqWrap" id="nowAlbumWrap">
              <span class="marq" id="nowAlbum">—</span>
            </div>
            <div class="sub" id="nowMsg" style="margin-top:12px;">—</div>
          </div>

          <!-- kept for app.js compatibility (no longer shown) -->
          <span id="nowUpdated" style="display:none;">--</span>

          <!-- kept for app.js compatibility (not used visually now) -->
          <div id="nowCoverWrap" style="display:none;"></div>
          <img id="nowImg" style="display:none;" alt="" />
          <div id="nowFallback" style="display:none;">♪</div>
        </div>
      </div>
    </section>

    <section class="panel hidden" data-panel="top">
      <div class="card">
        <div class="controls">
          <div class="seg" aria-label="Top type">
            <button data-top-type="tracks" aria-selected="true">Track</button>
            <button data-top-type="artists" aria-selected="false">Artist</button>
            <button data-top-type="albums" aria-selected="false">Album</button>
          </div>

          <div class="seg" aria-label="Top period">
            <button data-top-period="today" aria-selected="true">Today</button>
            <button data-top-period="week" aria-selected="false">Week</button>
            <button data-top-period="year" aria-selected="false">Year</button>
          </div>
        </div>

        <div class="list" id="topList" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel hidden" data-panel="recent">
      <div class="card">
        <div class="list" id="recentList" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
