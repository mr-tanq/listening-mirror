<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Listening Mirror</title>
  <style>
    :root{
      --bg:#0b0c0e;
      --txt:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.58);
      --muted2:rgba(255,255,255,.42);
      --stroke:rgba(255,255,255,.10);
      --radius:28px;
      --shadow: 0 12px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 30% 10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(255,255,255,.08), transparent 55%),
        var(--bg);
      color:var(--txt);
      min-height:100vh;
    }

    .bgArt{
      position:fixed; inset:-60px;
      background-size: cover;
      background-position: center;
      filter: blur(30px) saturate(1.05);
      opacity:.18;
      transform: scale(1.05);
      pointer-events:none;
      z-index:-2;
    }
    .bgFade{
      position:fixed; inset:0;
      background: radial-gradient(900px 600px at 50% 20%, rgba(255,255,255,.06), transparent 65%),
                  linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.65));
      pointer-events:none;
      z-index:-1;
    }

    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px;}
    h1{font-size:56px;letter-spacing:-1px;margin:18px 0 10px;}

    .tabs{
      display:flex; gap:12px; align-items:center;
      margin:10px 0 14px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:6px;
    }
    .tabs::-webkit-scrollbar{height:6px}
    .tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:999px}
    .dot{flex:0 0 auto;width:18px;height:18px;border-radius:999px;background:#38d06e;
      box-shadow:0 0 0 6px rgba(56,208,110,.12)}
    .tab{
      flex:0 0 auto;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      color:var(--txt);
      padding:10px 18px;border-radius:999px;
      font-weight:850; cursor:pointer; user-select:none;
      white-space:nowrap;
    }
    .tab[aria-selected="true"]{
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border-color:rgba(255,255,255,.18);
    }

    .subtabs{
      display:flex; gap:10px; align-items:center;
      margin:4px 0 14px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:4px;
    }
    .sub{
      flex:0 0 auto;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.18);
      color:var(--txt);
      padding:8px 14px;border-radius:999px;
      font-weight:850; cursor:pointer; user-select:none;
      white-space:nowrap;
      opacity:.9;
    }
    .sub[aria-selected="true"]{
      background:rgba(255,255,255,.10);
      border-color:rgba(255,255,255,.20);
      opacity:1;
    }

    .panel{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .panel h2{font-size:48px;margin:6px 0 14px;letter-spacing:-1px}

    .card{
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.22);
      border-radius:22px;
      padding:16px;
    }

    .muted{color:var(--muted);font-weight:750}
    .muted2{color:var(--muted2);font-weight:750}

    .nowGrid{display:grid; grid-template-columns: 120px 1fr; gap:16px; align-items:center;}
    .cover{
      width:120px;height:120px;border-radius:18px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.08);overflow:hidden;display:grid;place-items:center;
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .title{font-size:22px;font-weight:900;line-height:1.15;word-break:break-word;overflow-wrap:anywhere;}
    .subline{margin-top:6px;color:var(--muted);font-weight:750;word-break:break-word;overflow-wrap:anywhere;}

    .row{
      display:grid;
      grid-template-columns: 44px 56px 1fr auto;
      gap:12px; align-items:center;
      padding:14px 14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.22);
      margin-bottom:12px;
    }
    .rank{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      border:1px solid var(--stroke);
      color:rgba(255,255,255,.55);
      font-weight:900;
      background:rgba(255,255,255,.04);
    }
    .mini{
      width:56px;height:56px;border-radius:16px;
      border:1px solid var(--stroke);
      overflow:hidden;
      background:rgba(255,255,255,.08);
      display:grid;place-items:center;
    }
    .mini img{width:100%;height:100%;object-fit:cover;display:block;}
    .rowTitle{font-weight:900;line-height:1.18;font-size:18px;word-break:break-word;overflow-wrap:anywhere;}
    .rowSub{color:rgba(255,255,255,.42);font-weight:750;margin-top:4px;font-size:14px;word-break:break-word;overflow-wrap:anywhere;}
    .count{color:rgba(255,255,255,.60);font-weight:900;white-space:nowrap;font-variant-numeric: tabular-nums;}

    .ph{
      width:100%;height:100%;
      display:grid;place-items:center;
      background:
        radial-gradient(120px 120px at 30% 20%, rgba(255,255,255,.12), transparent 55%),
        radial-gradient(160px 120px at 70% 80%, rgba(255,255,255,.10), transparent 60%),
        rgba(255,255,255,.06);
    }
    .ph svg{width:26px;height:26px;opacity:.55;}

    .out{
      margin-top:12px;
      padding:14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.22);
      white-space:pre-wrap;
      line-height:1.5;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    @media (max-width: 640px){
      h1{font-size:44px;margin:10px 0 8px;}
      .panel{padding:16px;border-radius:24px;}
      .panel h2{font-size:40px}
      .nowGrid{grid-template-columns: 92px 1fr; gap:12px;}
      .cover{width:92px;height:92px;border-radius:16px;}
      .title{font-size:18px}
      .subline{font-size:14px}
      .row{grid-template-columns: 40px 52px 1fr; grid-template-areas:"rank art meta" "rank art count";}
      .rank{grid-area:rank;width:40px;height:40px}
      .mini{grid-area:art;width:52px;height:52px}
      .count{grid-area:count;justify-self:end;align-self:end}
      .rowTitle{font-size:16px}
      .rowSub{font-size:13px}
    }
  </style>
</head>

<body>
  <div class="bgArt" id="bgArt"></div>
  <div class="bgFade"></div>

  <div class="wrap">
    <h1>Listening Mirror</h1>

    <div class="tabs">
      <div class="dot" aria-hidden="true"></div>
      <div class="tab" data-tab="now" aria-selected="true">Now</div>
      <div class="tab" data-tab="top" aria-selected="false">Top</div>
      <div class="tab" data-tab="mirror" aria-selected="false">Mirror</div>
      <div class="tab" data-tab="history" aria-selected="false">History</div>
    </div>

    <section class="panel" data-panel="now">
      <h2>Now Playing</h2>
      <div class="card">
        <div class="nowGrid">
          <div class="cover" id="nowCover"></div>
          <div>
            <div class="title" id="nowTitle">Loading…</div>
            <div class="subline" id="nowAlbum"></div>
            <div class="muted" id="nowHint" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="top" style="display:none;">
      <div class="subtabs">
        <div class="sub" data-sub="today" aria-selected="true">Today</div>
        <div class="sub" data-sub="week" aria-selected="false">Week</div>
        <div class="sub" data-sub="year" aria-selected="false">Year</div>
      </div>

      <div data-subpanel="today">
        <h2>Top tracks</h2>
        <div id="topTodayTracks"></div>
        <div style="height:18px"></div>
        <h2 style="font-size:40px;margin-top:10px;">Top artists</h2>
        <div id="topTodayArtists"></div>
      </div>

      <div data-subpanel="week" style="display:none;">
        <h2>Top tracks</h2>
        <div id="topWeekTracks"></div>
        <div style="height:18px"></div>
        <h2 style="font-size:40px;margin-top:10px;">Top artists</h2>
        <div id="topWeekArtists"></div>
      </div>

      <div data-subpanel="year" style="display:none;">
        <h2>Top tracks</h2>
        <div id="topYearTracks"></div>
        <div style="height:18px"></div>
        <h2 style="font-size:40px;margin-top:10px;">Top artists</h2>
        <div id="topYearArtists"></div>
      </div>
    </section>

    <section class="panel" data-panel="mirror" style="display:none;">
      <h2>Mirror</h2>
      <div class="muted2">Generates automatically when you open this tab.</div>
      <div class="out" id="mirrorOut">Opening Mirror…</div>
    </section>

    <section class="panel" data-panel="history" style="display:none;">
      <h2>History</h2>
      <div id="historyList"></div>
      <div class="muted" id="historyEmpty" style="display:none;margin-top:14px;">No data yet.</div>
    </section>
  </div>

  <script>
    const DEFAULT_API = "https://i.errtanq9.workers.dev";
    const qsApi = new URL(location.href).searchParams.get("api");
    const storedApi = localStorage.getItem("BASE_API");
    const BASE_API = (qsApi || storedApi || DEFAULT_API).replace(/\/+$/,"");
    if (qsApi) localStorage.setItem("BASE_API", BASE_API);

    const $ = (id) => document.getElementById(id);

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    function placeholderHTML(){
      return `
        <div class="ph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 18V6.7c0-.4.24-.76.6-.92l8-3.6c.66-.3 1.4.18 1.4.9V15.5c0 1.66-1.79 3-4 3s-4-1.34-4-3 1.79-3 4-3c.75 0 1.46.16 2.06.44V5.3L11 8.1V18c0 1.66-1.79 3-4 3s-4-1.34-4-3 1.79-3 4-3c.75 0 1.46.16 2 .43Z" fill="rgba(255,255,255,.78)"/>
          </svg>
        </div>
      `;
    }

    function coverHTML(url){
      if (url) return `<img src="${url}" alt="" loading="lazy" />`;
      return placeholderHTML();
    }

    async function fetchJSON(path, opts = {}){
      const r = await fetch(BASE_API + path, { ...opts, mode:"cors", cache:"no-store" });
      const t = await r.text();
      let j = null;
      try { j = JSON.parse(t); } catch {}
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return j;
    }

    function setTab(name){
      document.querySelectorAll(".tab").forEach(t=>{
        t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false");
      });
      document.querySelectorAll("[data-panel]").forEach(p=>{
        p.style.display = (p.dataset.panel === name) ? "" : "none";
      });
    }

    function setSub(name){
      document.querySelectorAll(".sub").forEach(s=>{
        s.setAttribute("aria-selected", s.dataset.sub === name ? "true" : "false");
      });
      document.querySelectorAll("[data-subpanel]").forEach(p=>{
        p.style.display = (p.dataset.subpanel === name) ? "" : "none";
      });
    }

    function setBg(url){
      $("bgArt").style.backgroundImage = url ? `url("${url}")` : "";
    }

    document.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", async ()=>{
        const name = t.dataset.tab;
        setTab(name);
        if (name === "now") loadNow();
        if (name === "top") loadTopActive();
        if (name === "mirror") loadMirror();
        if (name === "history") loadHistory();
      });
    });

    document.querySelectorAll(".sub").forEach(s=>{
      s.addEventListener("click", ()=>{
        const name = s.dataset.sub;
        setSub(name);
        loadTopActive();
      });
    });

    async function loadNow(){
      $("nowHint").textContent = "";
      try{
        const d = await fetchJSON("/api/now");
        const title = d?.artist ? `${d.artist} — ${d.name}` : (d?.name || "—");
        $("nowTitle").textContent = title || "—";
        $("nowAlbum").textContent = d?.album || "";
        $("nowCover").innerHTML = coverHTML(d?.image);
        $("nowHint").textContent = d?.nowPlaying ? "LIVE now playing" : "";
      }catch(e){
        $("nowTitle").textContent = "Failed to load.";
        $("nowAlbum").textContent = "";
        $("nowCover").innerHTML = placeholderHTML();
        $("nowHint").textContent = "Check Worker.";
      }
    }

    function renderRows(containerId, items, mode){
      const el = $(containerId);
      el.innerHTML = "";
      (items || []).forEach((x, i)=>{
        const row = document.createElement("div");
        row.className = "row";

        let title = "";
        let sub = "";
        let count = "";

        if (mode === "trackOnly") {
          title = x?.name || "";
          sub = x?.artist || "";
          count = x?.playcount ? String(x.playcount) : "";
        } else if (mode === "artist") {
          title = x?.name || "";
          sub = "";
          count = x?.playcount ? String(x.playcount) : "";
        } else if (mode === "history") {
          title = `${x?.artist || ""} — ${x?.name || ""}`;
          sub = x?.album || "";
          count = x?.nowPlaying ? "LIVE" : "";
        }

        row.innerHTML = `
          <div class="rank">${i+1}</div>
          <div class="mini">${x?.image ? `<img src="${esc(x.image)}" alt="" loading="lazy">` : placeholderHTML()}</div>
          <div>
            <div class="rowTitle">${esc(title)}</div>
            <div class="rowSub">${esc(sub)}</div>
          </div>
          <div class="count">${esc(count)}</div>
        `;
        el.appendChild(row);
      });
    }

    function todayKeyFromUts(uts){
      if (!uts) return null;
      const d = new Date(Number(uts) * 1000);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    async function loadTopToday(){
      const recent = await fetchJSON("/api/recent?limit=120");
      const tracks = recent?.tracks || [];

      const now = new Date();
      const keyNow = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

      const todays = tracks.filter(t => todayKeyFromUts(t.uts) === keyNow);

      const trackMap = new Map();
      const artistMap = new Map();

      for (const t of todays) {
        const tn = `${t.artist} — ${t.name}`;
        trackMap.set(tn, (trackMap.get(tn) || 0) + 1);
        artistMap.set(t.artist, (artistMap.get(t.artist) || 0) + 1);
      }

      const topTracks = Array.from(trackMap.entries())
        .sort((a,b)=>b[1]-a[1])
        .slice(0,12)
        .map(([k,v])=>{
          const parts = k.split(" — ");
          return { name: parts.slice(1).join(" — "), artist: parts[0] || "", playcount: v, image: "" };
        });

      const topArtists = Array.from(artistMap.entries())
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10)
        .map(([name,playcount])=>({ name, playcount, image:"" }));

      const topArtistName = topArtists[0]?.name || "";
      if (topArtistName) {
        try {
          const a = await fetchJSON(`/api/artist?name=${encodeURIComponent(topArtistName)}`);
          setBg(a?.image || "");
        } catch { setBg(""); }
      } else {
        setBg("");
      }

      renderRows("topTodayTracks", topTracks, "trackOnly");
      renderRows("topTodayArtists", topArtists, "artist");
    }

    async function loadTopPeriod(period, tracksId, artistsId){
      const [t, a] = await Promise.all([
        fetchJSON(`/api/top?type=tracks&period=${encodeURIComponent(period)}&limit=12`),
        fetchJSON(`/api/top?type=artists&period=${encodeURIComponent(period)}&limit=10`)
      ]);

      const artists = a?.artists || [];
      const topArtistName = artists[0]?.name || "";

      if (topArtistName) {
        try {
          const ai = await fetchJSON(`/api/artist?name=${encodeURIComponent(topArtistName)}`);
          setBg(ai?.image || "");
        } catch { setBg(""); }
      } else {
        setBg("");
      }

      renderRows(tracksId, t?.tracks || [], "trackOnly");
      renderRows(artistsId, artists, "artist");
    }

    async function loadTopActive(){
      const active = document.querySelector('.sub[aria-selected="true"]')?.dataset?.sub || "today";
      try{
        if (active === "today") return await loadTopToday();
        if (active === "week") return await loadTopPeriod("7day", "topWeekTracks", "topWeekArtists");
        return await loadTopPeriod("12month", "topYearTracks", "topYearArtists");
      }catch(e){
        setBg("");
        const idT = active === "today" ? "topTodayTracks" : (active === "week" ? "topWeekTracks" : "topYearTracks");
        const idA = active === "today" ? "topTodayArtists" : (active === "week" ? "topWeekArtists" : "topYearArtists");
        $(idT).innerHTML = `<div class="muted">Failed to load.</div>`;
        $(idA).innerHTML = ``;
      }
    }

    async function loadMirror(){
      $("mirrorOut").textContent = "Generating…";
      try{
        const d = await fetchJSON("/api/mirror?period=7day");
        $("mirrorOut").textContent = d?.text || "No reflection.";
      }catch(e){
        $("mirrorOut").textContent = "Failed to load AI. Check OPENAI_API_KEY.";
      }
    }

    async function loadHistory(){
      const listEl = $("historyList");
      const emptyEl = $("historyEmpty");
      listEl.innerHTML = "";
      emptyEl.style.display = "none";
      setBg("");

      try{
        const d = await fetchJSON("/api/recent?limit=50");
        const tracks = d?.tracks || [];
        if (!tracks.length){ emptyEl.style.display=""; return; }
        renderRows("historyList", tracks, "history");
      }catch(e){
        emptyEl.style.display="";
        emptyEl.textContent = "Failed to load.";
      }
    }

    loadNow();
  </script>
</body>
</html>
